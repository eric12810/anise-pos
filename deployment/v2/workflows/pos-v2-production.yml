name: POS V2 Production Release
on:
  workflow_dispatch:
    inputs:
      staging_run_id: {description: 'Verified V2 staging run ID', required: true, type: string}
permissions: {contents: read, actions: read}
concurrency: {group: anise-pos-production, cancel-in-progress: false}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Resolve exact verified staging artifact
        id: resolve
        run: python3 deployment/v2/resolve.py
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          STAGING_RUN_ID: '${{ inputs.staging_run_id }}'
      - uses: actions/download-artifact@v4
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          run-id: '${{ inputs.staging_run_id }}'
          name: '${{ steps.resolve.outputs.artifact_name }}'
          path: artifacts/staging
      - uses: actions/checkout@v4
        with:
          ref: '${{ steps.resolve.outputs.release }}'
          path: release-source
          persist-credentials: false
      - name: Verify current managed files and retain pre-release archive
        id: backup
        run: python3 -m deployment.v2.cli backup --environment production --archive production-before.zip --backup-receipt production-before-receipt.json
        env: &production_env
          V2_ACTIVATED: '${{ vars.V2_ACTIVATED }}'
          V2_PRODUCTION_FTPS_HOST: '${{ secrets.LIVE_FTPS_HOST }}'
          V2_PRODUCTION_FTPS_USER: liveposftp
          V2_PRODUCTION_FTPS_PASSWORD: '${{ secrets.LIVE_FTPS_PASSWORD }}'
          V2_PRODUCTION_FTPS_ROOT: /wwwroot
          V2_PRODUCTION_SITE_URL: https://pos.loveanise.co.uk
          V2_PRODUCTION_DATABASE: anisedatabase
      - uses: actions/checkout@v4
        with:
          ref: '${{ steps.backup.outputs.current_release }}'
          path: current-source
          persist-credentials: false
      - name: Refuse routine release if database requirements changed
        run: python3 -m deployment.v2.schema_guard current-source release-source
      - uses: actions/upload-artifact@v4
        with:
          name: pos-v2-production-before-${{ github.run_id }}
          path: production-before.zip
          if-no-files-found: error
          retention-days: 90
      - name: Install exact staging artifact and verify health
        id: install
        run: python3 -m deployment.v2.cli deploy --environment production --release '${{ steps.resolve.outputs.release }}' --archive production-before.zip --backup-receipt production-before-receipt.json
        env: *production_env
      - name: Attempt application rollback after failed activation
        if: failure() && steps.install.outcome == 'failure'
        run: python3 -m deployment.v2.cli rollback --environment production --release '${{ steps.resolve.outputs.release }}' --archive production-before.zip
        env:
          V2_ACTIVATED: '${{ vars.V2_ACTIVATED }}'
          V2_PRODUCTION_FTPS_HOST: '${{ secrets.LIVE_FTPS_HOST }}'
          V2_PRODUCTION_FTPS_USER: liveposftp
          V2_PRODUCTION_FTPS_PASSWORD: '${{ secrets.LIVE_FTPS_PASSWORD }}'
          V2_PRODUCTION_FTPS_ROOT: /wwwroot
          V2_PRODUCTION_SITE_URL: https://pos.loveanise.co.uk
          V2_PRODUCTION_DATABASE: anisedatabase
          V2_ROLLBACK_APPROVAL: ROLLBACK POS PRODUCTION
