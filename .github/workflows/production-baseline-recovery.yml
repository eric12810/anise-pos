name: POS production baseline recovery

on:
  workflow_dispatch:
    inputs:
      inspection_run_id:
        description: 'Successful read-only production inspection run ID'
        required: true
        type: string
      owner_approval:
        description: 'Type FINALISE PRODUCTION BASELINE PENDING MANIFEST'
        required: true
        type: string

permissions: {contents: read, actions: read}

concurrency: {group: anise-pos-production, cancel-in-progress: false}

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.inspection_run_id }}
          name: production-baseline-inventory-${{ inputs.inspection_run_id }}
          path: artifacts/baseline
      - name: Finalise verified pending manifest only
        env:
          LIVE_FTPS_HOST: ${{ secrets.LIVE_FTPS_HOST }}
          LIVE_FTPS_USERNAME: ${{ secrets.LIVE_FTPS_USERNAME }}
          LIVE_FTPS_PASSWORD: ${{ secrets.LIVE_FTPS_PASSWORD }}
          PROD_FTPS_ROOT: ${{ vars.PROD_FTPS_ROOT }}
          PROD_BASELINE_RECOVERY_BACKUP_VERIFIED: ${{ vars.PROD_BASELINE_RECOVERY_BACKUP_VERIFIED }}
          PROD_BASELINE_APP_BACKUP_REFERENCE: ${{ vars.PROD_BASELINE_APP_BACKUP_REFERENCE }}
          PROD_BASELINE_SQL_BACKUP_REFERENCE: ${{ vars.PROD_BASELINE_SQL_BACKUP_REFERENCE }}
        run: |
          test '${{ inputs.owner_approval }}' = 'FINALISE PRODUCTION BASELINE PENDING MANIFEST'
          mkdir -p recovery-evidence
          python3 scripts/production-baseline-recover.py \
            --inventory artifacts/baseline/production-inventory.json \
            --evidence recovery-evidence/pending-manifest.json \
            --owner-approval '${{ inputs.owner_approval }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-baseline-recovery-evidence-${{ github.run_id }}
          path: recovery-evidence
          if-no-files-found: ignore
          retention-days: 90
