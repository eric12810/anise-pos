name: POS production FTPS diagnostic

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [diagnostic, release-verify]
        default: diagnostic
        required: true
      staging_run_id:
        description: Exact approved staging release run ID
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: anise-pos-production-ftps-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify production FTPS account and site folder read-only
        env:
          LIVE_FTPS_HOST: ${{ secrets.LIVE_FTPS_HOST }}
          LIVE_FTPS_USERNAME: ${{ secrets.LIVE_FTPS_USERNAME }}
          LIVE_FTPS_PASSWORD: ${{ secrets.LIVE_FTPS_PASSWORD }}
          PROD_FTPS_ROOT: ${{ vars.PROD_FTPS_ROOT }}
        run: python3 scripts/production-ftps-diagnostic.py

  release-verify:
    if: github.ref == 'refs/heads/staging' && inputs.mode == 'release-verify' && inputs.staging_run_id == '43572186352'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve exact approved staging artifact
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: python3 scripts/resolve-staging-release.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.staging_run_id }}
          name: ${{ steps.resolve.outputs.artifact_name }}
          path: artifacts/staging
      - name: Read-only production manifest and file verification
        env:
          DEPLOYMENT_ENV: production
          LIVE_FTPS_HOST: ${{ secrets.LIVE_FTPS_HOST }}
          LIVE_FTPS_USERNAME: ${{ secrets.LIVE_FTPS_USERNAME }}
          LIVE_FTPS_PASSWORD: ${{ secrets.LIVE_FTPS_PASSWORD }}
          PROD_FTPS_ROOT: ${{ vars.PROD_FTPS_ROOT }}
        run: python3 scripts/production-release-verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-release-verification-${{ github.run_id }}
          path: production-release-verification.json
          if-no-files-found: ignore
          retention-days: 90
