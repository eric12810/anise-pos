name: POS V2 Staging Deploy
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      operation:
        description: Staging operation
        type: choice
        options: [deploy, recover]
        default: deploy
        required: true
      healthy_run_id:
        description: Recovery only — successful V2 run holding the last healthy artifact
        type: string
      failed_release:
        description: Recovery only — failed release commit SHA
        type: string
permissions: {contents: read, actions: read}
concurrency: {group: anise-pos-staging, cancel-in-progress: false}
jobs:
  build:
    if: (github.ref == 'refs/heads/staging' && (github.event_name == 'push' || inputs.operation == 'deploy')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/push-production-safe')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$GITHUB_REF_NAME")"
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '9.0.x'}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/NuGet.Config', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore AnisePOS.sln
      - run: dotnet build AnisePOS.sln --configuration Release --no-restore
      - run: dotnet run --project tests/AnisePOS.Checks --configuration Release --no-build
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests/deployment -v
      - run: python3 scripts/check-migrations.py
      - run: dotnet publish src/AnisePOS.Api/AnisePOS.Api.csproj --configuration Release --no-restore --no-self-contained -p:UseAppHost=false --output artifacts/staging
      - run: python3 scripts/build-web-assets.py artifacts/staging/wwwroot
      - run: python3 scripts/review-staging-package.py
      - run: python3 -m deployment.v2.prepare artifacts/staging
      - run: python3 -m deployment.v2.cli package --environment staging --artifact artifacts/staging
        env:
          V2_STAGING_FTPS_HOST: '${{ secrets.STAGING_FTPS_HOST }}'
          V2_STAGING_FTPS_USER: stageposftp
          V2_STAGING_FTPS_ROOT: /stageposftp/wwwroot
          V2_STAGING_SITE_URL: https://pos-staging.loveanise.co.uk
          V2_STAGING_DATABASE: anisedb
      - uses: actions/upload-artifact@v4
        with:
          name: anise-pos-v2-${{ github.sha }}
          path: artifacts/staging
          if-no-files-found: error
          retention-days: 90
  deploy:
    name: Deploy and verify staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: 'anise-pos-v2-${{ github.sha }}', path: artifacts/staging}
      - name: Install exact artifact and verify application health
        run: python3 -m deployment.v2.cli staging-deploy --environment staging --release '${{ github.sha }}'
        env: &staging_env
          V2_ACTIVATED: 'yes'
          V2_STAGING_FTPS_HOST: '${{ secrets.STAGING_FTPS_HOST }}'
          V2_STAGING_FTPS_USER: stageposftp
          V2_STAGING_FTPS_PASSWORD: '${{ secrets.STAGING_FTPS_PASSWORD }}'
          V2_STAGING_FTPS_ROOT: /stageposftp/wwwroot
          V2_STAGING_SITE_URL: https://pos-staging.loveanise.co.uk
          V2_STAGING_DATABASE: anisedb
  recover:
    name: Recover last healthy staging artifact
    if: github.ref == 'refs/heads/staging' && github.event_name == 'workflow_dispatch' && inputs.operation == 'recover'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Resolve exact successful V2 staging artifact
        id: resolve
        run: python3 -m deployment.v2.resolve
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          STAGING_RUN_ID: '${{ inputs.healthy_run_id }}'
      - uses: actions/download-artifact@v4
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          run-id: '${{ inputs.healthy_run_id }}'
          name: '${{ steps.resolve.outputs.artifact_name }}'
          path: artifacts/staging
      - name: Restore exact healthy artifact and verify application health
        run: python3 -m deployment.v2.cli staging-recover --environment staging --release '${{ inputs.failed_release }}'
        env:
          V2_ACTIVATED: 'yes'
          V2_STAGING_FTPS_HOST: '${{ secrets.STAGING_FTPS_HOST }}'
          V2_STAGING_FTPS_USER: stageposftp
          V2_STAGING_FTPS_PASSWORD: '${{ secrets.STAGING_FTPS_PASSWORD }}'
          V2_STAGING_FTPS_ROOT: /stageposftp/wwwroot
          V2_STAGING_SITE_URL: https://pos-staging.loveanise.co.uk
          V2_STAGING_DATABASE: anisedb
          V2_STAGING_RECOVERY_APPROVAL: RECOVER POS STAGING
