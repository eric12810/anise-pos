name: POS application-only rollback 43576579126

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or approved application restore
        type: choice
        options: [preflight, restore]
        default: preflight
        required: true
      production_approval:
        description: Type ROLLBACK POS RELEASE 43576579126
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: anise-pos-production
  cancel-in-progress: false

jobs:
  rollback:
    if: >-
      github.ref == 'refs/heads/staging' &&
      (inputs.mode == 'preflight' ||
       (inputs.mode == 'restore' && inputs.production_approval == 'ROLLBACK POS RELEASE 43576579126'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Confirm protected production backup gate
        env:
          PROD_BACKUP_CONFIRMED: ${{ secrets.PROD_BACKUP_CONFIRMED }}
        run: test "$PROD_BACKUP_CONFIRMED" = true
      - name: Verify current production files and back up complete managed application
        env:
          DEPLOYMENT_ENV: production
          LIVE_FTPS_HOST: ${{ secrets.LIVE_FTPS_HOST }}
          LIVE_FTPS_USERNAME: ${{ secrets.LIVE_FTPS_USERNAME }}
          LIVE_FTPS_PASSWORD: ${{ secrets.LIVE_FTPS_PASSWORD }}
          PROD_FTPS_ROOT: ${{ vars.PROD_FTPS_ROOT }}
        run: python3 scripts/production-rollback-43576579126.py preflight
      - name: Preserve current managed application backup
        uses: actions/upload-artifact@v4
        with:
          name: pos-current-before-rollback-${{ github.run_id }}
          path: production-current-managed-backup.zip
          if-no-files-found: error
          retention-days: 90
      - name: Restore and verify old application only
        if: inputs.mode == 'restore'
        env:
          DEPLOYMENT_ENV: production
          LIVE_FTPS_HOST: ${{ secrets.LIVE_FTPS_HOST }}
          LIVE_FTPS_USERNAME: ${{ secrets.LIVE_FTPS_USERNAME }}
          LIVE_FTPS_PASSWORD: ${{ secrets.LIVE_FTPS_PASSWORD }}
          PROD_FTPS_ROOT: ${{ vars.PROD_FTPS_ROOT }}
          PRODUCTION_APPROVAL: ${{ inputs.production_approval }}
        run: python3 scripts/production-rollback-43576579126.py restore --approval "$PRODUCTION_APPROVAL"
