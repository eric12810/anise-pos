name: POS production baseline inspection

on:
  workflow_dispatch:
    inputs:
      staging_run_id: {description: 'Successful staging dry-run ID for comparison', required: true, type: string}

permissions: {contents: read, actions: read}

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Resolve approved staging dry run
        id: resolve
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', STAGING_RUN_ID: '${{ inputs.staging_run_id }}'}
        run: python3 scripts/resolve-staging-release.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ secrets.GITHUB_TOKEN }}', run-id: '${{ inputs.staging_run_id }}', name: '${{ steps.resolve.outputs.artifact_name }}', path: artifacts/staging}
      - run: cp artifacts/staging/release-manifest.sha256 artifacts/staging-manifest.sha256
      - name: Inventory production FTPS read-only
        env:
          LIVE_FTPS_HOST: ${{ secrets.LIVE_FTPS_HOST }}
          LIVE_FTPS_USERNAME: ${{ secrets.LIVE_FTPS_USERNAME }}
          LIVE_FTPS_PASSWORD: ${{ secrets.LIVE_FTPS_PASSWORD }}
          PROD_FTPS_ROOT: ${{ vars.PROD_FTPS_ROOT }}
        run: python3 scripts/production-baseline.py inspect --package artifacts/staging --output artifacts/baseline
      - uses: actions/upload-artifact@v4
        with:
          name: production-baseline-inventory-${{ github.run_id }}
          path: artifacts/baseline
          if-no-files-found: error
          retention-days: 90
