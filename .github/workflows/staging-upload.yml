name: POS staging FTPS

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      mode:
        description: Select a staging operation
        type: choice
        options: [deploy, check, dry-run, rename-test, v2-ftps-probe, v2-baseline]
        default: deploy
        required: true
      baseline_approval:
        description: 'For v2-baseline only, enter SEED POS V2 BASELINE'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pos-staging-ftps
  cancel-in-progress: false

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  validate:
    name: Build, test and validate package
    if: >-
      (github.event_name != 'workflow_dispatch' || (inputs.mode != 'check' && inputs.mode != 'rename-test' && inputs.mode != 'v2-ftps-probe' && inputs.mode != 'v2-baseline')) &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[rename-probe]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # The read-only checkout token is needed by the branch-head safety
          # check below. It is not an FTPS credential and is never logged.
          persist-credentials: true
      - name: Verify staging commit is current
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging')
        run: |
          git fetch --no-tags --depth=1 origin staging
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore .NET dependencies
        run: dotnet restore AnisePOS.sln
      - name: Build Release solution
        run: dotnet build AnisePOS.sln --configuration Release --no-restore
      - name: Run application checks
        run: dotnet run --project tests/AnisePOS.Checks --configuration Release --no-build
      - name: Run deployment safeguard tests
        run: python3 -m unittest discover -s tests/deployment -v
      - name: Preflight SQL migrations without database access
        run: python3 scripts/check-migrations.py
      - name: Publish staging API
        run: >-
          dotnet publish src/AnisePOS.Api/AnisePOS.Api.csproj
          --configuration Release --no-restore --no-self-contained
          -p:UseAppHost=false --output artifacts/staging
      - name: Minify and compress publish assets
        run: python3 scripts/build-web-assets.py artifacts/staging/wwwroot
      - name: Validate package and create manifest
        run: python3 scripts/review-staging-package.py
      - name: Store exact validated package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anise-pos-staging-${{ github.sha }}
          path: artifacts/staging
          if-no-files-found: error
          retention-days: 90

  ftps-check:
    name: Check staging FTPS
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check encrypted staging connection
        env:
          STAGING_FTPS_HOST: ${{ secrets.STAGING_FTPS_HOST }}
          STAGING_FTPS_USERNAME: ${{ secrets.STAGING_FTPS_USERNAME }}
          STAGING_FTPS_PASSWORD: ${{ secrets.STAGING_FTPS_PASSWORD }}
        run: python3 scripts/upload-staging.py

  rename-test:
    name: Test disposable staging FTP rename
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rename-test' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Rename and clean up one disposable staging file
        env:
          STAGING_FTPS_HOST: ${{ secrets.STAGING_FTPS_HOST }}
          STAGING_FTPS_USERNAME: ${{ secrets.STAGING_FTPS_USERNAME }}
          STAGING_FTPS_PASSWORD: ${{ secrets.STAGING_FTPS_PASSWORD }}
        run: python3 scripts/staging-rename-probe.py

  v2-ftps-probe:
    name: Probe V2 staging FTPS transport
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'v2-ftps-probe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Probe disposable staging file only
        env:
          V2_STAGING_FTPS_HOST: ${{ secrets.STAGING_FTPS_HOST }}
          V2_STAGING_FTPS_USER: stageposftp
          V2_STAGING_FTPS_PASSWORD: ${{ secrets.STAGING_FTPS_PASSWORD }}
          V2_STAGING_FTPS_ROOT: /stageposftp/wwwroot
          V2_STAGING_SITE_URL: https://pos-staging.loveanise.co.uk
          V2_STAGING_DATABASE: anisedb
          V2_FTPS_PROBE_APPROVAL: PROBE STAGING FTPS
        run: python3 -m deployment.v2.cli ftps-probe --environment staging

  v2-baseline:
    name: Verify exact staging artifact and seed V2 baseline
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'v2-baseline' && github.ref == 'refs/heads/main' && inputs.baseline_approval == 'SEED POS V2 BASELINE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve exact successful staging deployment
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGING_RUN_ID: '43586075499'
        run: python3 scripts/resolve-staging-release.py
      - name: Confirm exact reviewed commit
        run: test '${{ steps.release.outputs.commit_sha }}' = '0504481381965d8f770d03beaaeaaf2234ff64b0'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: '43586075499'
          name: ${{ steps.release.outputs.artifact_name }}
          path: artifacts/v2-baseline
      - name: Verify original 126-file artifact
        run: python3 -m deployment.v2.staging_baseline original artifacts/v2-baseline
      - name: Prepare and validate 125-file V2 candidate
        run: |
          python3 -m deployment.v2.prepare artifacts/v2-baseline
          python3 -m deployment.v2.cli package --environment staging --artifact artifacts/v2-baseline
        env: &v2_baseline_env
          V2_STAGING_FTPS_HOST: ${{ secrets.STAGING_FTPS_HOST }}
          V2_STAGING_FTPS_USER: stageposftp
          V2_STAGING_FTPS_PASSWORD: ${{ secrets.STAGING_FTPS_PASSWORD }}
          V2_STAGING_FTPS_ROOT: /stageposftp/wwwroot
          V2_STAGING_SITE_URL: https://pos-staging.loveanise.co.uk
          V2_STAGING_DATABASE: anisedb
          V2_SEED_APPROVAL: ${{ inputs.baseline_approval }}
      - name: Read-only remote file and health comparison
        env: *v2_baseline_env
        run: python3 -m deployment.v2.staging_baseline live artifacts/v2-baseline
      - name: Seed exact healthy baseline metadata only
        env: *v2_baseline_env
        run: python3 -m deployment.v2.cli seed --environment staging --artifact artifacts/v2-baseline --release 0504481381965d8f770d03beaaeaaf2234ff64b0
      - name: Read back state and recheck health
        env: *v2_baseline_env
        run: python3 -m deployment.v2.staging_baseline state artifacts/v2-baseline --release 0504481381965d8f770d03beaaeaaf2234ff64b0

  deploy:
    name: Deploy staging FTPS
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' && github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download exact validated package
        uses: actions/download-artifact@v4
        with:
          name: anise-pos-staging-${{ github.sha }}
          path: artifacts/staging
      - name: Prepare immutable package manifest
        run: cp artifacts/staging/release-manifest.sha256 artifacts/staging-manifest.sha256
      - name: Upload validated package to staging FTPS
        env:
          STAGING_FTPS_HOST: ${{ secrets.STAGING_FTPS_HOST }}
          STAGING_FTPS_USERNAME: ${{ secrets.STAGING_FTPS_USERNAME }}
          STAGING_FTPS_PASSWORD: ${{ secrets.STAGING_FTPS_PASSWORD }}
        run: python3 scripts/upload-staging.py --deploy
      - name: Verify staging POS health
        run: curl --fail --silent --show-error --max-time 20 https://pos-staging.loveanise.co.uk/health > /dev/null
