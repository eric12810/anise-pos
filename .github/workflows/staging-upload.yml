name: POS staging FTPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check connection or upload to staging
        type: choice
        options: [check, deploy]
        default: check
      confirmation:
        description: 'For upload, type: DEPLOY pos'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pos-staging-ftps
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Validate requested operation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$MODE" = deploy ]; then
            test "$CONFIRMATION" = 'DEPLOY pos-staging.loveanise.co.uk'
          else
            test "$MODE" = check
          fi
      - name: Build and check
        run: |
          dotnet build AnisePOS.sln --configuration Release
          dotnet run --project tests/AnisePOS.Checks --configuration Release --no-build
          python3 -m unittest discover -s tests/deployment -v
      - name: Prepare reviewed package
        run: |
          dotnet publish src/AnisePOS.Api/AnisePOS.Api.csproj --configuration Release --no-restore --no-self-contained -p:UseAppHost=false --output artifacts/staging
          python3 scripts/review-staging-package.py
      - name: Explicit FTPS operation
        env:
          STAGING_FTPS_HOST: ${{ secrets.STAGING_FTPS_HOST }}
          STAGING_FTPS_USERNAME: ${{ secrets.STAGING_FTPS_USERNAME }}
          STAGING_FTPS_PASSWORD: ${{ secrets.STAGING_FTPS_PASSWORD }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = deploy ]; then
            python3 scripts/upload-staging.py --deploy
          else
            python3 scripts/upload-staging.py
          fi
