name: POS production baseline bootstrap

on:
  workflow_dispatch:
    inputs:
      inspection_run_id: {description: 'Successful read-only baseline inspection run ID', required: true, type: string}
      owner_confirmation: {description: 'Type ESTABLISH PRODUCTION BASELINE', required: true, type: string}

permissions: {contents: read, actions: read}

concurrency: {group: anise-pos-production, cancel-in-progress: false}

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.inspection_run_id }}
          name: production-baseline-inventory-${{ inputs.inspection_run_id }}
          path: artifacts/baseline
      - name: Publish verified baseline manifest only
        env:
          LIVE_FTPS_HOST: ${{ secrets.LIVE_FTPS_HOST }}
          LIVE_FTPS_USERNAME: ${{ secrets.LIVE_FTPS_USERNAME }}
          LIVE_FTPS_PASSWORD: ${{ secrets.LIVE_FTPS_PASSWORD }}
          PROD_FTPS_ROOT: ${{ vars.PROD_FTPS_ROOT }}
          PROD_BASELINE_BACKUP_VERIFIED: ${{ vars.PROD_BASELINE_BACKUP_VERIFIED }}
          PROD_BASELINE_APP_BACKUP_REFERENCE: ${{ vars.PROD_BASELINE_APP_BACKUP_REFERENCE }}
          PROD_BASELINE_SQL_BACKUP_REFERENCE: ${{ vars.PROD_BASELINE_SQL_BACKUP_REFERENCE }}
          PROD_BASELINE_OWNER_CONFIRMATION: ${{ inputs.owner_confirmation }}
        run: python3 scripts/production-baseline.py bootstrap --inventory artifacts/baseline/production-inventory.json
