name: POS production release
on:
  workflow_dispatch:
    inputs:
      staging_run_id: {description: 'Exact successful staging dry-run ID', required: true, type: string}
permissions: {contents: read, actions: read}
concurrency: {group: anise-pos-production, cancel-in-progress: false}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Resolve approved staging dry run
        id: resolve
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}', STAGING_RUN_ID: '${{ inputs.staging_run_id }}'}
        run: python3 scripts/resolve-staging-release.py
      - uses: actions/download-artifact@v4
        with: {github-token: '${{ secrets.GITHUB_TOKEN }}', run-id: '${{ inputs.staging_run_id }}', name: '${{ steps.resolve.outputs.artifact_name }}', path: artifacts/staging}
      - run: python3 scripts/production-preflight.py
      - run: cp artifacts/staging/release-manifest.sha256 artifacts/staging-manifest.sha256
      - name: Validate target and deploy exact approved package
        env:
          PROD_FTPS_EXPECTED_HOST: ${{ secrets.LIVE_FTPS_HOST }}
          PROD_FTPS_EXPECTED_ROOT: ${{ vars.PROD_FTPS_ROOT }}
          PROD_FTPS_SECRET_HOST: ${{ secrets.LIVE_FTPS_HOST }}
          PROD_FTPS_USERNAME: ${{ secrets.LIVE_FTPS_USERNAME }}
          PROD_FTPS_PASSWORD: ${{ secrets.LIVE_FTPS_PASSWORD }}
          PROD_DB_SERVER: ${{ secrets.PROD_DB_SERVER }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_BACKUP_CONFIRMED: ${{ secrets.PROD_BACKUP_CONFIRMED }}
          STAGING_FTPS_HOST: ${{ vars.STAGING_FTPS_HOST }}
          DEPLOYMENT_ENV: production
          DEPLOY_FTPS_HOST: ${{ secrets.LIVE_FTPS_HOST }}
          DEPLOY_FTPS_USERNAME: ${{ secrets.LIVE_FTPS_USERNAME }}
          DEPLOY_FTPS_PASSWORD: ${{ secrets.LIVE_FTPS_PASSWORD }}
          DEPLOY_FTPS_ROOT: ${{ vars.PROD_FTPS_ROOT }}
          DEPLOY_CONFIRMATION_TEXT: DEPLOY production pos
          DEPLOY_CONFIRMATION: DEPLOY production pos
        run: |
          python3 scripts/production-deploy.py \
            --mode deploy \
            --host "$PROD_FTPS_EXPECTED_HOST" \
            --root "$PROD_FTPS_EXPECTED_ROOT" \
            --db-server "$PROD_DB_SERVER" \
            --db-name "$PROD_DB_NAME"
          python3 scripts/upload-staging.py --deploy
      - name: Verify live POS health after deployment
        run: curl --fail --silent --show-error --max-time 20 https://pos.loveanise.co.uk/health > /dev/null
