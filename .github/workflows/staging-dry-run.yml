name: POS staging dry run

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore AnisePOS.sln
      - name: Build
        run: dotnet build AnisePOS.sln --configuration Release --no-restore
      - name: Check order transitions without starting the API
        run: dotnet run --project tests/AnisePOS.Checks --configuration Release --no-build
      - name: Check deployment safeguards offline
        run: python3 -m unittest discover -s tests/deployment -v
      - name: Prepare package without connecting to hosting
        run: dotnet publish src/AnisePOS.Api/AnisePOS.Api.csproj --configuration Release --no-restore --no-self-contained -p:UseAppHost=false --output artifacts/staging
      - name: Review package and create manifest
        run: python3 scripts/review-staging-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: anise-pos-staging-${{ github.sha }}
          path: artifacts/staging
          if-no-files-found: error
          retention-days: 90
