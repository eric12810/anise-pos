<title>Anise — Order queue</title>
<style>
body:not(.authenticated) main,body:not(.authenticated) .toolbar{display:none}
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#20352a;font:16px system-ui,sans-serif}
header{padding:18px 24px;background:white;display:flex;gap:20px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #dbe2d9}
h1{font-size:23px;margin:0}a{color:#2c6447}#staff{margin-left:auto}
.toolbar{padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}#message{margin:0 24px 16px;color:#a32929}
main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:0 24px 24px}
h2{font-size:18px}.card{background:white;border:1px solid #dbe2d9;border-top:5px solid #bd9146;border-radius:10px;padding:18px;margin-bottom:16px}
.preparing .card{border-top-color:#4e7da1}.ready .card{border-top-color:#2c6447}
.card.overdue{background:#fff0f0}.card .overdue-label{color:#a32929;font-size:13px;font-weight:700;margin:0 0 8px}.card .overdue-label[hidden]{display:none}
h3{font-size:20px;margin:0 0 8px}.detail{color:#526458;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
ul{padding-left:20px}li{margin:10px 0;overflow-wrap:anywhere}.note{background:#fff2d9;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}
button{min-height:46px;padding:10px 16px;border:1px solid #bdcdbf;border-radius:7px;background:white;color:#20352a;font:inherit;cursor:pointer}
.payment{margin:12px 0 0;padding:8px 10px;border-radius:6px;background:#fff0d5;color:#805300;font-weight:700}.payment.paid{background:#e6f4e9;color:#24613b}.payment.missing{background:#eee;color:#666}.payment-action{width:100%;margin-top:8px;background:#fff7e8;border-color:#d6a24c;font-weight:700}.receipt-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.receipt-actions .payment-action{margin-top:0}.receipt-actions a{display:flex;align-items:center;justify-content:center;min-height:42px;padding:8px;border:1px solid #bdcdbf;border-radius:7px;background:#fff;text-align:center;text-decoration:none}.advance{width:100%;background:#2c6447;border:0;color:white;font-weight:700;margin-top:12px}button:disabled{opacity:.55;cursor:wait}
.accept-form{margin-top:12px}.accept-form label{display:grid;gap:6px;font-size:14px;font-weight:600}.accept-form input{width:100%;padding:10px;border:1px solid #bdcdbf;border-radius:7px;font:inherit}.decline-order{width:100%;margin-top:8px;border-color:#a32929;color:#a32929}.empty{color:#687a6b;font-size:14px}
.accept-form .eta-wheel{width:100%;height:46px;padding:8px 10px;border:1px solid #bdcdbf;border-radius:7px;background:#fff;color:#20352a;font:inherit}.accept-form>.detail{margin:8px 0 0;font-weight:700}
.queue-summary{width:100%;text-align:left;color:inherit}.queue-summary .queue-private{display:none}.queue-summary h3{font-size:18px}.queue-card-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.queue-card-heading h3{min-width:0;overflow-wrap:anywhere;margin:0;line-height:1.25}.queue-summary p{margin:7px 0}.queue-summary ul{margin:8px 0;padding-left:20px}.queue-summary li{margin:4px 0}.queue-summary .open-hint{flex:0 1 auto;max-width:55%;min-width:0;min-height:38px;margin:0;padding:6px 8px;color:#2c6447;font-size:13px;font-weight:700;line-height:1.2;white-space:normal;overflow-wrap:anywhere}.queue-summary:focus-visible{outline:3px solid #bd9146;outline-offset:3px}.order-detail-dialog{width:min(560px,calc(100% - 32px));max-height:calc(100dvh - 32px);border:0;border-radius:12px;padding:20px;background:#f6f5ef;color:#20352a;box-shadow:0 18px 60px #0005}.order-detail-dialog::backdrop{background:#0009}.detail-dialog-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.detail-dialog-top h2{margin:0}.order-detail-dialog .card{margin:0}.detail-dialog-status{color:#a32929;white-space:pre-wrap}.detail-dialog-status:empty{display:none}
 .cancel-dialog{width:min(460px,calc(100% - 32px));border:0;border-radius:12px;padding:22px;background:#f6f5ef;color:#20352a;box-shadow:0 18px 60px #0007}.cancel-dialog::backdrop{background:#0009}.cancel-options{display:grid;gap:8px;margin:14px 0}.cancel-options label{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #bdcdbf;border-radius:8px;background:#fff;min-height:48px}.cancel-options input{width:20px;height:20px}.cancel-dialog #cancel-other{display:grid;gap:6px}.cancel-dialog #cancel-other[hidden]{display:none}.cancel-dialog #cancel-other input{padding:11px;border:1px solid #bdcdbf;border-radius:7px;font:inherit}.cancel-dialog #cancel-error{color:#a32929;min-height:1.4em}.cancel-dialog>div{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.cancel-dialog #cancel-confirm{background:#a32929;color:#fff;border-color:#a32929}
@media(max-width:850px){main{grid-template-columns:1fr}header,.toolbar{padding:16px}main{padding:0 16px 16px}}
</style>

<header class="pos-header"><h1>Order queue</h1><nav class="pos-navigation" aria-label="POS navigation"><a href="/pos.html">POS</a><a href="/orders.html">Order queue</a><a href="/history.html">Order history</a><a href="/menu-admin.html" data-roles="Owner,Manager" hidden>Menu manager</a><a href="/reports.html" data-roles="Owner,Manager" hidden>Reports</a><a href="/website-settings.html" data-roles="Owner,Manager" hidden>Settings</a><a href="/staff-admin.html" data-roles="Owner" hidden>Staff</a></nav><span id="staff"></span></header>
