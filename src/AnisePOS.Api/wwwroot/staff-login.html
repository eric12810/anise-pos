<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anise POS — Staff sign in</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 360px; margin: 12vh auto; padding: 24px; color: #243025; }
    h1 { margin-bottom: 4px; } p { color: #607064; } label { display: block; margin-top: 18px; font-weight: 600; }
    input, button { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 6px; font: inherit; }
    button { margin-top: 24px; background: #274c35; border: 0; border-radius: 6px; color: white; cursor: pointer; }
    #message { min-height: 24px; margin-top: 16px; } .error { color: #a82929; } .success { color: #18703c; }
  </style>
</head>
<body>
  <h1>Anise POS</h1><p>Staff sign in</p>
  <form id="login-form">
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p id="message" aria-live="polite"></p>
  <script>
    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const message = document.querySelector('#message');
      const email = document.querySelector('#email');
      const password = document.querySelector('#password');
      message.className = ''; message.textContent = 'Signing in…';
      const response = await fetch('/api/staff/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ email: email.value, password: password.value }) });
      if (response.ok) {
        const staff = await response.json();
        message.className = 'success';
        message.textContent = `Signed in as ${staff.displayName} (${staff.role}).`;
        password.value = '';
        const returnTo = new URLSearchParams(location.search).get('return');
        location.assign(returnTo === '/orders.html' ? returnTo : '/pos.html');
      }
      else { message.className = 'error'; message.textContent = response.status === 401 ? 'Email or password is incorrect.' : 'Sign-in failed. Please try again.'; }
    });
  </script>
</body>
</html>
