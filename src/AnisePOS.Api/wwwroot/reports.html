<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anise — Sales reports</title>
<style>
body:not(.authenticated) main{display:none}*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#20352a;font:16px system-ui,sans-serif}header{padding:18px 24px;background:#fff;display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dbe2d9}h1{font-size:23px;margin:0}a{color:#2c6447}#staff{margin-left:auto;color:#617067}main{max-width:1120px;margin:22px auto;padding:0 18px}.panel{background:#fff;border:1px solid #dbe2d9;border-radius:10px;padding:18px;margin-bottom:16px}.range{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.presets{display:flex;flex-basis:100%;order:2;gap:7px;flex-wrap:wrap}.range label{display:grid;gap:5px;font-size:13px;font-weight:700}.range input,.range button{min-height:42px;padding:8px 12px;border:1px solid #bdcdbf;border-radius:7px;background:#fff;color:#20352a;font:inherit}.range button{cursor:pointer}.range button.active,.range .run{background:#2c6447;color:#fff;border-color:#2c6447;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #dbe2d9;border-radius:10px;padding:17px}.card span{display:block;color:#617067;font-size:13px}.card strong{display:block;font-size:25px;margin-top:5px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}h2{font-size:19px;margin:0 0 12px}.bar-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin:10px 0}.bar{height:12px;background:#e8ede8;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#2c6447}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:11px 8px;border-bottom:1px solid #e1e7e1}th:first-child,td:first-child{text-align:left}#message{color:#a32929}.empty{color:#617067;text-align:center;padding:20px}
.eod{margin-left:auto;background:#bd9146!important;border-color:#bd9146!important;color:#fff!important;font-weight:750}.modal-backdrop{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:12px;padding:22px;box-shadow:0 18px 60px #0005}.modal h2{font-size:22px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal label{display:grid;gap:5px;font-size:13px;font-weight:700}.modal input{width:100%;min-height:43px;padding:8px 10px;border:1px solid #bdcdbf;border-radius:7px;font:inherit}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.modal-actions button{min-height:43px;padding:8px 14px;border:1px solid #bdcdbf;border-radius:7px;background:#fff;color:#20352a;font:inherit;cursor:pointer}.modal-actions .primary{background:#2c6447;color:#fff;border-color:#2c6447;font-weight:700}
@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.eod{margin-left:0}}
@media(max-width:520px){header{padding:15px}#staff{width:100%;margin:0}.cards{grid-template-columns:1fr 1fr}.card strong{font-size:21px}.range label{width:calc(50% - 5px)}.range input{width:100%}table{font-size:14px}}
</style><link rel="stylesheet" href="/pos-navigation.css?v=7"><script defer src="/pos-navigation.js?v=9"></script><link rel="manifest" href="/pos.webmanifest"><link rel="apple-touch-icon" href="/pos-icon.png"><meta name="theme-color" content="#2c6447"></head><body>
<header class="pos-header"><h1>Sales reports</h1><nav class="pos-navigation" aria-label="POS navigation"><a href="/pos.html">POS</a><a href="/orders.html">Order queue</a><a href="/history.html">Order history</a><a href="/menu-admin.html" data-roles="Owner,Manager" hidden>Menu manager</a><a href="/reports.html" data-roles="Owner,Manager" hidden>Reports</a><a href="/website-settings.html" data-roles="Owner,Manager" hidden>Settings</a><a href="/staff-admin.html" data-roles="Owner" hidden>Staff</a></nav><span id="staff"></span></header>
<main><section class="panel range"><label>Start date<input id="from" type="date"></label><label>End date<input id="to" type="date"></label><button id="run" class="run">Show report</button><div class="presets"><button data-range="today">Today</button><button data-range="week">This week</button><button data-range="month" class="active">This month</button></div><button id="end-of-day" class="eod">End of day</button><span id="message" role="alert"></span></section>
<section class="cards"><div class="card"><span>Sales</span><strong id="gross">—</strong></div><div class="card"><span>Average order</span><strong id="average">—</strong></div><div class="card"><span>Orders</span><strong id="orders-count">—</strong></div><div class="card"><span>Cash</span><strong id="cash">—</strong></div><div class="card"><span>Card</span><strong id="card">—</strong></div><div class="card"><span>Cancelled / refunded</span><strong id="excluded">—</strong></div><div class="card"><span>Refunds</span><strong id="refunds">—</strong></div></section>
<section class="split" style="margin-top:16px"><section class="panel"><h2>Order type</h2><div id="type-bars"></div></section><section class="panel"><h2>Daily totals</h2><div id="daily"></div></section></section></main>
<div id="eod-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="eod-title"><form id="eod-form" class="modal"><h2 id="eod-title">End of day printout</h2><p>Enter the gross takings shown by each delivery platform. These figures are used for this printout only.</p><div class="modal-grid"><label style="grid-column:1/-1">Trading date<input id="eod-date" name="date" type="date" required></label><label>Uber Eats<input name="uberEats" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></label><label>Just Eat Card<input name="justEatCard" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></label><label>Deliveroo<input name="deliveroo" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></label><label>Just Eat Cash<input name="justEatCash" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></label></div><div class="modal-actions"><button type="button" id="eod-cancel">Cancel</button><button class="primary">Preview and print</button></div></form></div>
<script>
'use strict';const money=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}),message=document.querySelector('#message');
function localDate(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-')}
function setRange(type){const now=new Date(),from=new Date(now),to=new Date(now);if(type==='week'){const day=(now.getDay()+6)%7;from.setDate(now.getDate()-day)}if(type==='month')from.setDate(1);document.querySelector('#from').value=localDate(from);document.querySelector('#to').value=localDate(to);document.querySelectorAll('[data-range]').forEach(b=>b.classList.toggle('active',b.dataset.range===type))}
async function api(url){const response=await fetch(url,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000)});if(response.status===401){location.replace('/staff-login.html?return=%2Freports.html');throw new Error('Sign in required.')}if(response.status===403)throw new Error('Only owners and managers can view reports.');if(!response.ok)throw new Error('Could not load the sales report.');return response.json()}
function bar(label,value,total){const width=total?Math.round(value/total*100):0;return `<div class="bar-row"><span>${label}</span><div class="bar"><i style="width:${width}%"></i></div><strong>${value}</strong></div>`}
function render(report){document.querySelector('#refunds').textContent=money.format(report.completedRefunds);document.querySelector('#gross').textContent=money.format(report.grossSales);document.querySelector('#average').textContent=money.format(report.averageOrderValue);document.querySelector('#orders-count').textContent=report.orderCount;document.querySelector('#cash').textContent=money.format(report.cashSales);document.querySelector('#card').textContent=money.format(report.cardSales);document.querySelector('#excluded').textContent=report.cancelledOrders+' / '+report.refundedOrders;document.querySelector('#type-bars').innerHTML=bar('Collection',report.collectionOrders,report.orderCount)+bar('Delivery',report.deliveryOrders,report.orderCount);document.querySelector('#daily').innerHTML=report.days.length?`<table><thead><tr><th>Date</th><th>Orders</th><th>Gross</th><th>Paid</th></tr></thead><tbody>${report.days.map(d=>`<tr><td>${new Date(d.date+'T00:00:00').toLocaleDateString('en-GB')}</td><td>${d.orderCount}</td><td>${money.format(d.grossSales)}</td><td>${money.format(d.paidSales)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">No orders in this period.</p>'}
async function load(){message.textContent='Loading…';const fromValue=document.querySelector('#from').value,toValue=document.querySelector('#to').value;if(!fromValue||!toValue){message.textContent='Choose both dates.';return}const from=new Date(fromValue+'T00:00:00'),to=new Date(toValue+'T00:00:00');to.setDate(to.getDate()+1);try{const params=new URLSearchParams({from:from.toISOString(),to:to.toISOString(),timeZoneOffsetMinutes:String(new Date().getTimezoneOffset())});render(await api('/api/reports/sales?'+params));message.textContent=''}catch(error){message.textContent=error.message}}
document.querySelectorAll('[data-range]').forEach(button=>button.onclick=()=>{setRange(button.dataset.range);load()});document.querySelector('#run').onclick=load;
const eodModal=document.querySelector('#eod-modal');document.querySelector('#end-of-day').onclick=()=>{document.querySelector('#eod-date').value=localDate(new Date());eodModal.classList.add('open')};document.querySelector('#eod-cancel').onclick=()=>eodModal.classList.remove('open');eodModal.addEventListener('click',event=>{if(event.target===eodModal)eodModal.classList.remove('open')});
function setupCentsInput(input){input.addEventListener('focus',()=>input.select());input.addEventListener('input',()=>{const digits=input.value.replace(/\D/g,'');input.value=digits?(Number(digits)/100).toFixed(2):''});input.addEventListener('blur',()=>{if(input.value)input.value=(Math.max(0,Number(input.value))||0).toFixed(2)})}
document.querySelectorAll('#eod-form input[inputmode="decimal"]').forEach(setupCentsInput);document.querySelector('#eod-form').onsubmit=event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.target));for(const key of ['uberEats','justEatCard','justEatCash','deliveroo'])data[key]=Math.max(0,Number(data[key])||0);sessionStorage.setItem('anise.endOfDay',JSON.stringify(data));location.href='/end-of-day.html'};
(async()=>{try{const me=await api('/api/staff/me');document.querySelector('#staff').textContent=me.name+' · '+me.role;document.body.classList.add('authenticated');setRange('month');await load()}catch(error){message.textContent=error.message}})();
</script></body></html>
