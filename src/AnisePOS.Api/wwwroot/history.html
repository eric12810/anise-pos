<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anise — Order history</title>
<style>
body:not(.authenticated) main,body:not(.authenticated) .filters{display:none}
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#20352a;font:16px system-ui,sans-serif}
header{padding:18px 24px;background:#fff;display:flex;gap:20px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #dbe2d9}h1{font-size:23px;margin:0}a{color:#2c6447}#staff{margin-left:auto;color:#617067}
.filters{display:grid;grid-template-columns:minmax(220px,2fr) repeat(4,minmax(135px,1fr)) auto;gap:12px;padding:20px 24px;background:#fff;border-bottom:1px solid #dbe2d9;align-items:end}
label{display:grid;gap:6px;font-size:13px;font-weight:700;color:#526458}input,select,button{min-height:44px;border:1px solid #bdcdbf;border-radius:7px;background:#fff;color:#20352a;font:inherit;padding:9px 11px}button{cursor:pointer}.primary{background:#2c6447;color:#fff;border-color:#2c6447;font-weight:700}
#message{margin:16px 24px;color:#a32929}main{padding:0 24px 28px}.summary{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px;color:#526458}
.orders{display:grid;gap:12px}.order{background:#fff;border:1px solid #dbe2d9;border-radius:10px;padding:16px;display:grid;grid-template-columns:minmax(160px,1.3fr) minmax(120px,1fr) minmax(130px,1fr) auto;gap:18px;align-items:center}.order h2{font-size:19px;margin:0 0 5px}.muted{font-size:14px;color:#617067;margin:3px 0}.amount{font-size:19px;font-weight:800}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf2ee;font-size:13px;font-weight:700}.status.completed{background:#e6f4e9;color:#24613b}.status.cancelled,.status.refunded{background:#f8e5e5;color:#8b2929}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions a{display:flex;align-items:center;justify-content:center;min-height:40px;padding:7px 10px;border:1px solid #bdcdbf;border-radius:7px;text-decoration:none;text-align:center;white-space:nowrap}.actions .details{grid-column:1/-1;background:#f4f7f4}
.detail{display:none;grid-column:1/-1;border-top:1px solid #e3e8e2;padding-top:14px}.detail.open{display:block}.detail-line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed #d3d9d2}.detail-note{white-space:pre-wrap;background:#fff2d9;padding:10px}.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:18px}.empty{text-align:center;padding:45px;background:#fff;border-radius:10px;color:#617067}
@media(max-width:1000px){.filters{grid-template-columns:repeat(2,1fr)}.filters .search{grid-column:1/-1}.order{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}}
@media(max-width:580px){header,.filters,main{padding-left:14px;padding-right:14px}.filters{grid-template-columns:1fr}.filters .search{grid-column:auto}.order{grid-template-columns:1fr}.actions{grid-column:auto}.detail{grid-column:auto}#staff{width:100%;margin-left:0}}
</style>
</head>
<body>
<header><h1>Order history</h1><a href="/pos.html">POS</a><a href="/orders.html">Order queue</a><a href="/menu-admin.html">Menu manager</a><a href="/reports.html">Reports</a><span id="staff"></span></header>
<form class="filters" id="filters">
  <label class="search">Order number, name, phone or address<input id="query" autocomplete="off" placeholder="Search orders"></label>
  <label>Status<select id="status"><option value="">All statuses</option><option>Draft</option><option>Placed</option><option>Accepted</option><option>Preparing</option><option>Ready</option><option>Completed</option><option>Cancelled</option><option>Refunded</option></select></label>
  <label>Order type<select id="order-type"><option value="">All types</option><option>Collection</option><option>Delivery</option></select></label>
  <label>From<input id="from" type="date"></label>
  <label>To<input id="to" type="date"></label>
  <button class="primary" type="submit">Search</button>
</form>
<p id="message" role="alert">Checking staff sign-in…</p>
<main><div class="summary"><span id="summary"></span><button id="clear" type="button">Clear filters</button></div><section class="orders" id="orders"></section><nav class="pager"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></nav></main>
<script>
'use strict';
const ordersTarget=document.querySelector('#orders'),message=document.querySelector('#message'),summary=document.querySelector('#summary'),money=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});let currentPage=1,loading=false;
const el=(tag,text,className)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node};
async function request(url){const response=await fetch(url,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000)});if(response.status===401){location.replace('/staff-login.html?return=%2Fhistory.html');throw new Error('Your staff session expired.')}if(!response.ok)throw new Error('Could not load order history.');return response.json()}
function receiptLink(order,type,label){const link=el('a',label);link.href='/receipt.html?order='+order.orderNumber+'&type='+type+'&return=history';return link}
async function showDetails(order,button,target){if(target.classList.contains('open')){target.classList.remove('open');button.textContent='View details';return}button.disabled=true;try{const detail=await request('/api/orders/'+order.orderNumber+'/receipt');target.replaceChildren();const customer=[detail.customerName,detail.customerPhone,detail.deliveryAddress].filter(Boolean);if(customer.length)target.append(el('p',customer.join(' · '),'muted'));for(const line of detail.lines){const row=el('div',undefined,'detail-line'),name=el('span',line.quantity+' × '+line.productName+(line.variantName==='Regular'?'':' — '+line.variantName));if(line.modifiers.length)name.append(el('small',' — '+line.modifiers.map(m=>m.modifierName).join(', '),'muted'));if(line.notes)name.append(el('small',' · Note: '+line.notes,'muted'));row.append(name,el('strong',money.format(line.lineTotal)));target.append(row)}if(detail.notes)target.append(el('p','Note: '+detail.notes,'detail-note'));target.classList.add('open');button.textContent='Hide details'}catch(error){message.textContent=error.message}finally{button.disabled=false}}
function render(data){ordersTarget.replaceChildren();summary.textContent=data.totalCount+' order'+(data.totalCount===1?'':'s');const totalPages=Math.max(1,Math.ceil(data.totalCount/data.pageSize));document.querySelector('#page').textContent='Page '+data.page+' of '+totalPages;document.querySelector('#previous').disabled=data.page<=1;document.querySelector('#next').disabled=data.page>=totalPages;if(!data.items.length){ordersTarget.append(el('p','No orders matched your search.','empty'));return}for(const order of data.items){const card=el('article',undefined,'order'),identity=el('div');identity.append(el('h2','#'+order.orderNumber+' · '+order.orderType),el('p',new Date(order.createdAtUtc).toLocaleString('en-GB'),'muted'));const customer=el('div');customer.append(el('strong',order.customerName||'No customer name'),el('p',order.customerPhone||order.itemCount+' item'+(order.itemCount===1?'':'s'),'muted'));const totals=el('div');totals.append(el('div',money.format(order.total),'amount'),el('span',order.status,'status '+order.status.toLowerCase()));if(order.payment)totals.append(el('p',order.payment.method+' · '+order.payment.status,'muted'));const actions=el('div',undefined,'actions'),detailsButton=el('a','View details','details');detailsButton.href='#';const detail=el('div',undefined,'detail');detailsButton.onclick=event=>{event.preventDefault();showDetails(order,detailsButton,detail)};actions.append(detailsButton,receiptLink(order,'customer','Customer receipt'));card.append(identity,customer,totals,actions,detail);ordersTarget.append(card)}}
function dateBoundary(id,addDay){const value=document.querySelector(id).value;if(!value)return '';const date=new Date(value+'T00:00:00');if(addDay)date.setDate(date.getDate()+1);return date.toISOString()}
async function load(page=1){if(loading)return;loading=true;message.textContent='';const params=new URLSearchParams({page:String(page),pageSize:'25'}),values=[['query','#query'],['status','#status'],['orderType','#order-type']];for(const [key,id]of values){const value=document.querySelector(id).value.trim();if(value)params.set(key,value)}const from=dateBoundary('#from',false),to=dateBoundary('#to',true);if(from)params.set('from',from);if(to)params.set('to',to);try{const data=await request('/api/orders/history?'+params);currentPage=data.page;render(data)}catch(error){message.textContent=error.message}finally{loading=false}}
document.querySelector('#filters').onsubmit=event=>{event.preventDefault();load(1)};document.querySelector('#clear').onclick=()=>{document.querySelector('#filters').reset();load(1)};document.querySelector('#previous').onclick=()=>load(currentPage-1);document.querySelector('#next').onclick=()=>load(currentPage+1);
(async()=>{try{const staff=await request('/api/staff/me');document.querySelector('#staff').textContent=staff.name+' · '+staff.role;document.body.classList.add('authenticated');await load()}catch{location.replace('/staff-login.html?return=%2Fhistory.html')}})();
</script>
</body>
</html>
