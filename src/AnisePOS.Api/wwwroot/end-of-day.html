<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anise — End of day</title><style>*{box-sizing:border-box}body{margin:0;background:#eee;color:#111;font:16px system-ui,sans-serif}.controls{display:flex;gap:10px;justify-content:center;padding:18px}.controls a,.controls button{padding:11px 18px;border:1px solid #bbb;border-radius:7px;background:#fff;color:#20352a;font:inherit;text-decoration:none;cursor:pointer}.controls button{background:#2c6447;color:#fff;border-color:#2c6447;font-weight:700}.report{width:min(460px,calc(100% - 24px));margin:0 auto 30px;padding:25px;background:#fff;box-shadow:0 4px 18px #0002}h1{text-align:center;font-size:25px;margin:0 0 4px}h2{text-align:center;font-size:21px;margin:5px 0 18px}.meta{text-align:center;color:#444;margin:4px 0 16px}.section{margin-top:18px;padding-top:12px;border-top:1px dashed #888}.section h3{font-size:16px;margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:14px;padding:5px 0}.subtle{color:#555}.grand{font-size:21px;font-weight:800;border-top:2px solid #111;margin-top:9px;padding-top:10px}.warning{margin-top:15px;padding:10px;background:#fff2d9}.footer{text-align:center;margin-top:22px;padding-top:12px;border-top:1px dashed #888;color:#555;font-size:13px}.error{text-align:center;color:#a32929}#print-status{text-align:center;color:#555}@media print{body{background:#fff}.controls{display:none}.report{width:100%;margin:0;padding:0;box-shadow:none}@page{margin:8mm}}</style></head><body><div class="controls"><a href="/reports.html">Back to reports</a><button id="print">Print end-of-day</button></div><p id="print-status" role="status"></p><main class="report" id="report"><p>Preparing end-of-day report…</p></main><script src="/end-of-day-print.js?v=1"></script><script>'use strict';const target=document.querySelector('#report'),money=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function row(label,value,className=''){return `<div class="row ${className}"><span>${esc(label)}</span><span>${money.format(value)}</span></div>`}let printData=null;document.querySelector('#print').onclick=async()=>{if(!printData)return;const status=document.querySelector('#print-status'),button=document.querySelector('#print');button.disabled=true;status.textContent='Sending to Epson…';try{await printEndOfDay(...printData);status.textContent='End-of-day report sent to the Epson printer.'}catch(error){status.textContent=error.message||'Could not confirm printing. Check the printer and Wi-Fi.'}finally{button.disabled=false}};(async()=>{let input;try{input=JSON.parse(sessionStorage.getItem('anise.endOfDay')||'null')}catch{}if(!input?.date){target.innerHTML='<p class="error">No end-of-day figures were supplied. Return to Reports and select End of day.</p>';return}const from=new Date(input.date+'T00:00:00'),to=new Date(input.date+'T00:00:00');to.setDate(to.getDate()+1);const params=new URLSearchParams({from:from.toISOString(),to:to.toISOString(),timeZoneOffsetMinutes:String(new Date().getTimezoneOffset())});try{const response=await fetch('/api/reports/sales?'+params,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000)});if(response.status===401){location.replace('/staff-login.html?return=%2Freports.html');return}if(!response.ok)throw new Error();const report=await response.json(),external={uberEats:Number(input.uberEats)||0,justEatCard:Number(input.justEatCard)||0,justEatCash:Number(input.justEatCash)||0,deliveroo:Number(input.deliveroo)||0};printData=[new Date(input.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric'}),report,external];const platformTotal=Object.values(external).reduce((a,b)=>a+b,0),combined=report.paidSales+platformTotal;document.title='Anise — End of day '+input.date;target.innerHTML=`<h1>ANISE</h1><h2>END OF DAY</h2><p class="meta">${printData[0]}</p><section class="section"><h3>AnisePOS</h3>${row('Gross sales',report.grossSales)}${row('Paid takings',report.paidSales)}${row('Cash paid',report.cashSales,'subtle')}${row('Card paid',report.cardSales,'subtle')}${report.pendingSales?row('Awaiting payment',report.pendingSales):''}<div class="row subtle"><span>Order count</span><span>${report.orderCount}</span></div></section><section class="section"><h3>Delivery platforms</h3>${row('Uber Eats',external.uberEats)}${row('Just Eat Card',external.justEatCard)}${row('Just Eat Cash',external.justEatCash)}${row('Deliveroo',external.deliveroo)}${row('Platform total',platformTotal)}</section><section class="section">${row('Total recorded takings',combined,'grand')}</section>${report.pendingSales?`<p class="warning">${money.format(report.pendingSales)} of AnisePOS orders are still awaiting payment and are not included in total recorded takings.</p>`:''}<p class="footer">Printed ${new Date().toLocaleString('en-GB')}</p>`}catch{target.innerHTML='<p class="error">Could not load the AnisePOS totals for this date.</p>'}})();</script></body></html>
