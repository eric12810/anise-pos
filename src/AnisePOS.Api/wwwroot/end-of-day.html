<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anise — End of day</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eee;color:#111;font:16px system-ui,sans-serif}.controls{display:flex;gap:10px;justify-content:center;padding:18px}.controls a,.controls button{padding:11px 18px;border:1px solid #bbb;border-radius:7px;background:#fff;color:#20352a;font:inherit;text-decoration:none;cursor:pointer}.controls button{background:#2c6447;color:#fff;border-color:#2c6447;font-weight:700}.controls button:disabled{opacity:.65;cursor:wait}.report{width:min(460px,calc(100% - 24px));margin:0 auto 30px;padding:25px;background:#fff;box-shadow:0 4px 18px #0002}h1{text-align:center;font-size:25px;margin:0 0 4px}h2{text-align:center;font-size:21px;margin:5px 0 18px}.meta{text-align:center;color:#444;margin:4px 0 16px}.section{margin-top:18px;padding-top:12px;border-top:1px dashed #888}.section h3{font-size:16px;margin:0 0 8px}.row{display:flex;justify-content:space-between;gap:14px;padding:5px 0}.subtle{color:#555}.grand{font-size:21px;font-weight:800;border-top:2px solid #111;margin-top:9px;padding-top:10px}.warning{margin-top:15px;padding:10px;background:#fff2d9}.footer{text-align:center;margin-top:22px;padding-top:12px;border-top:1px dashed #888;color:#555;font-size:13px}.error{text-align:center;color:#a32929}#print-status{text-align:center;color:#555;margin:0 18px 14px}@media print{body{background:#fff}.controls,#print-status{display:none}.report{width:100%;margin:0;padding:0;box-shadow:none}@page{margin:8mm}}
  </style>
</head>
<body>
  <div class="controls"><a href="/reports.html">Back to reports</a><button id="print" disabled>Print end-of-day</button></div>
  <p id="print-status" role="status" aria-live="polite"></p>
  <main class="report" id="report"><p>Preparing end-of-day report…</p></main>
  <script>
    'use strict';
    const reportTarget=document.querySelector('#report');
    const printButton=document.querySelector('#print');
    const printStatus=document.querySelector('#print-status');
    const currency=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'});
    const htmlEscape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const xmlEscape=value=>String(value??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    let endOfDayPrintData=null;

    function reportRow(label,value,className=''){
      return `<div class="row ${className}"><span>${htmlEscape(label)}</span><span>${currency.format(value)}</span></div>`;
    }

    async function getPrinterAddress(){
      const response=await fetch('/api/printer-settings',{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(10000)});
      if(!response.ok)throw new Error('Could not load printer settings.');
      const data=await response.json();
      if(!/^\d{1,3}(?:\.\d{1,3}){3}$/.test(data.ipAddress))throw new Error('Invalid printer address.');
      return data.ipAddress;
    }

    function epsonText(value){return `<text>${xmlEscape(value)}\n</text>`}
    function endOfDayEpsonContent(date,report,platforms){
      const platformTotal=Object.values(platforms).reduce((sum,value)=>sum+value,0);
      const combined=report.paidSales+platformTotal;
      return [
        '<text align="center" em="true">ANISE\n</text>',
        '<text align="center">END OF DAY\n'+xmlEscape(date)+'\n\n</text>',
        '<text em="true">ANISEPOS\n</text>',
        epsonText('Gross sales: '+currency.format(report.grossSales)),
        epsonText('Paid takings: '+currency.format(report.paidSales)),
        epsonText('Cash paid: '+currency.format(report.cashSales)),
        epsonText('Card paid: '+currency.format(report.cardSales)),
        epsonText('Order count: '+report.orderCount),
        '<text>\n</text><text em="true">DELIVERY PLATFORMS\n</text>',
        epsonText('Uber Eats: '+currency.format(platforms.uberEats)),
        epsonText('Just Eat Card: '+currency.format(platforms.justEatCard)),
        epsonText('Deliveroo: '+currency.format(platforms.deliveroo)),
        epsonText('Just Eat Cash: '+currency.format(platforms.justEatCash)),
        epsonText('Platform total: '+currency.format(platformTotal)),
        '<text>\n</text><text em="true">TOTAL RECORDED TAKINGS: '+xmlEscape(currency.format(combined))+'\n</text>',
        '<text>\n\n\n</text><cut type="feed"/>'
      ].join('');
    }

    async function printEndOfDayToEpson(date,report,platforms){
      const body=`<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body><epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">${endOfDayEpsonContent(date,report,platforms)}</epos-print></s:Body></s:Envelope>`;
      const response=await fetch('https://'+await getPrinterAddress()+'/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000',{method:'POST',headers:{'Content-Type':'text/xml; charset=utf-8'},body,signal:AbortSignal.timeout(15000),credentials:'omit'});
      if(!response.ok)throw new Error('The printer returned HTTP '+response.status+'. Check the printer before retrying.');
      const xml=new DOMParser().parseFromString(await response.text(),'application/xml');
      const result=xml.getElementsByTagNameNS('*','response')[0];
      if(!result)throw new Error('The printer returned an unrecognised response. Check the printer before retrying.');
      if(result.getAttribute('success')!=='true')throw new Error('The printer reported an error ('+(result.getAttribute('code')||'unknown')+'). Check the printer before retrying.');
    }

    printButton.addEventListener('click',async()=>{
      if(!endOfDayPrintData)return;
      printButton.disabled=true;
      printStatus.textContent='Sending to Epson…';
      try{
        await printEndOfDayToEpson(endOfDayPrintData.date,endOfDayPrintData.report,endOfDayPrintData.platforms);
        printStatus.textContent='End-of-day report sent to the Epson printer.';
      }catch(error){
        printStatus.textContent=error.name==='TypeError'||error.name==='TimeoutError'?'Could not confirm printing. Check the printer, Wi-Fi, local network permission and printer certificate.':error.message;
      }finally{printButton.disabled=false}
    });

    (async()=>{
      let input;
      try{input=JSON.parse(sessionStorage.getItem('anise.endOfDay')||'null')}catch{}
      if(!input?.date){reportTarget.innerHTML='<p class="error">No end-of-day figures were supplied. Return to Reports and select End of day.</p>';return}
      const from=new Date(input.date+'T00:00:00'),to=new Date(input.date+'T00:00:00');
      to.setDate(to.getDate()+1);
      const params=new URLSearchParams({from:from.toISOString(),to:to.toISOString(),timeZoneOffsetMinutes:String(new Date().getTimezoneOffset())});
      try{
        const response=await fetch('/api/reports/sales?'+params,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000)});
        if(response.status===401){location.replace('/staff-login.html?return=%2Freports.html');return}
        if(!response.ok)throw new Error();
        const report=await response.json();
        const platforms={uberEats:Number(input.uberEats)||0,justEatCard:Number(input.justEatCard)||0,deliveroo:Number(input.deliveroo)||0,justEatCash:Number(input.justEatCash)||0};
        const date=new Date(input.date+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
        const platformTotal=Object.values(platforms).reduce((sum,value)=>sum+value,0),combined=report.paidSales+platformTotal;
        endOfDayPrintData={date,report,platforms};
        printButton.disabled=false;
        document.title='Anise — End of day '+input.date;
        reportTarget.innerHTML=`<h1>ANISE</h1><h2>END OF DAY</h2><p class="meta">${date}</p><section class="section"><h3>AnisePOS</h3>${reportRow('Gross sales',report.grossSales)}${reportRow('Paid takings',report.paidSales)}${reportRow('Cash paid',report.cashSales,'subtle')}${reportRow('Card paid',report.cardSales,'subtle')}${report.pendingSales?reportRow('Awaiting payment',report.pendingSales):''}<div class="row subtle"><span>Order count</span><span>${report.orderCount}</span></div></section><section class="section"><h3>Delivery platforms</h3>${reportRow('Uber Eats',platforms.uberEats)}${reportRow('Just Eat Card',platforms.justEatCard)}${reportRow('Deliveroo',platforms.deliveroo)}${reportRow('Just Eat Cash',platforms.justEatCash)}${reportRow('Platform total',platformTotal)}</section><section class="section">${reportRow('Total recorded takings',combined,'grand')}</section>${report.pendingSales?`<p class="warning">${currency.format(report.pendingSales)} of AnisePOS orders are still awaiting payment and are not included in total recorded takings.</p>`:''}<p class="footer">Printed ${new Date().toLocaleString('en-GB')}</p>`;
      }catch{reportTarget.innerHTML='<p class="error">Could not load the AnisePOS totals for this date.</p>'}
    })();
  </script>
</body>
</html>
