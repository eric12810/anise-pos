<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anise POS</title>
  <style>
    :root { --ink:#20352a; --green:#2c6447; --paper:#f6f5ef; --line:#dbe2d9; --accent:#e7b65d; }
    * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:16px system-ui,sans-serif }
    header { height:68px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; background:#fff; border-bottom:1px solid var(--line) } h1 { font-size:22px; margin:0 } #staff { color:#617067 }
    main { display:grid; grid-template-columns:minmax(0,1fr) 390px; height:calc(100vh - 68px) }.menu { display:grid; grid-template-columns:180px minmax(0,1fr); gap:18px; padding:22px; min-width:0; min-height:0; overflow:hidden }.cart { background:#fff; border-left:1px solid var(--line); padding:20px; display:flex; flex-direction:column; overflow:auto }
    .categories { display:flex; flex-direction:column; align-items:stretch; gap:8px; overflow-y:auto; min-height:0; padding:0 4px 12px 0 }.category { flex:none; min-height:50px; border:1px solid var(--line); background:white; color:var(--ink); padding:12px 14px; border-radius:9px; text-align:left; overflow-wrap:anywhere; font-size:15px; font-weight:700; cursor:pointer }.category:focus-visible { outline:3px solid var(--accent); outline-offset:-3px }.category.active { background:var(--ink); color:#fff; border-color:var(--ink) }
    #products { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); grid-auto-rows:max-content; align-content:start; align-items:stretch; gap:14px; overflow-y:auto; min-width:0; min-height:0; padding-right:4px }.product { width:100%; height:auto; min-width:0; min-height:126px; align-self:stretch; display:flex; flex-direction:column; align-items:stretch; text-align:left; border:1px solid var(--line); background:#fff; border-radius:12px; padding:14px; color:inherit; touch-action:pan-y; user-select:none }.product:active { transform:scale(.98) }.product-image { display:block; width:100%; height:78px; object-fit:cover; border-radius:6px; margin-bottom:8px; flex:none }.product h2 { min-width:0; flex:none; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; overflow-wrap:anywhere; font-size:17px; line-height:1.25; margin:0 0 6px }.product .chinese-name { min-width:0; flex:none; display:block; color:var(--ink); font-size:21px; font-weight:700; line-height:1.3; margin:0 0 6px; overflow-wrap:anywhere }.product p { color:#65756a; font-size:13px; margin:0 }.price { display:block; flex:none; min-width:0; margin-top:auto; padding-top:8px; color:var(--green); font-size:17px; line-height:1.3; font-weight:750; overflow-wrap:anywhere }
    h2 { font-size:19px; margin:0 0 14px }.cart-lines { flex:1 }.line { padding:12px 0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr auto; gap:8px }.line small { color:#65756a; display:block }.qty { display:flex; align-items:center; gap:5px }.qty button { width:42px; height:42px; border:1px solid var(--line); background:#fff; border-radius:7px; font-size:22px; line-height:1; touch-action:manipulation }.qty span { display:inline-block; min-width:28px; text-align:center; font-weight:700 }#delivery-warning{margin:12px 0 0;padding:10px 12px;border-radius:6px;background:#fff0d5;color:#8a5500;font-size:14px;font-weight:700}.custom-fee{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:end}.total { background:white;color:var(--green);border:0;cursor:pointer;font-family:inherit;display:flex; justify-content:space-between; font-size:21px; font-weight:750; padding:17px 0 }
    label { display:block; font-size:13px; font-weight:700; margin-top:12px } input,textarea,select { width:100%; margin-top:5px; padding:10px; border:1px solid var(--line); border-radius:6px; font:inherit } textarea { resize:vertical }.field-status{display:block;min-height:18px;margin-top:4px;color:#617067;font-size:12px;font-weight:500}.delivery-fields[hidden],#address-results[hidden]{display:none}.postcode-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:end;min-width:0}.postcode-row>label,#postcode-search{min-width:0;max-width:100%}#postcode-search{overflow:visible}#postcode-search gmp-place-autocomplete{display:block;width:100%;max-width:100%;min-width:0;margin-top:5px}.postcode-row button{flex:0 0 auto;width:76px;min-height:43px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#edf2ed;color:var(--ink);font:inherit;font-weight:700}.types { display:flex; gap:6px }.types button { flex:1; padding:10px 4px; background:white; border:1px solid var(--line); border-radius:6px }.types button.active { background:var(--green); color:#fff; border-color:var(--green) }.primary { padding:14px; width:100%; background:var(--green); color:white; border:0; border-radius:7px; font-weight:750; font-size:16px; margin-top:16px }.primary:disabled { background:#93a59a } #notice { min-height:23px; color:#b03a2e; font-size:14px; margin-top:8px }.success { color:#207244!important }
    .cart-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.cart-heading h2{margin:0}.clear-order{min-height:44px;padding:8px 12px;border:1px solid #b03a2e;border-radius:7px;background:#fff;color:#a32929;font:inherit;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation}.clear-order:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    #estimate-minutes{height:46px}
    #save-address{display:block;min-height:44px;margin:7px 0 0 auto;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:#edf2ed;color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation}#save-address:disabled{opacity:.6;cursor:default}
    dialog { border:0; padding:0; border-radius:12px; width:min(480px,calc(100vw - 32px)); max-height:90vh; overflow:auto; box-shadow:0 18px 60px #0004 } dialog::backdrop { background:#18332677 }.modal { padding:24px }.modal h2 { margin-bottom:4px }.choice { display:flex; align-items:center; gap:9px; padding:10px 0; border-bottom:1px solid var(--line) }.choice input { width:auto; margin:0 }.modal-quantity { display:flex; align-items:center; gap:16px; margin-top:5px }.modal-quantity button { width:44px; height:44px; border:1px solid var(--line); border-radius:7px; background:#fff; font-size:24px }.modal-quantity output { min-width:32px; text-align:center; font-size:18px; font-weight:700 }.modal-error { color:#b03a2e; font-size:14px; font-weight:700 }.modal-footer { display:flex; gap:10px; margin:20px -24px -24px; padding:14px 24px; position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line) }.modal-footer button { flex:1; padding:12px; border-radius:6px; border:1px solid var(--line); background:white }.modal-footer .primary { margin:0; border:0; background:var(--green); color:#fff }
    #route-dialog { width:100vw; height:100vh; height:100dvh; max-width:none; max-height:none; margin:0; border-radius:0; overflow:hidden; padding:0; background:var(--paper) }
    #route-dialog::backdrop { background:#183326 }
    .cart-item{cursor:pointer;border-radius:6px}.cart-item:focus-visible{outline:3px solid #b6753c;outline-offset:2px}
    .route-modal { --route-vh:100dvh; width:100%; height:var(--route-vh); min-height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden; padding:0; background:var(--paper) }
    .route-header { position:relative; z-index:2; display:flex; align-items:center; gap:16px; min-height:86px; padding:calc(12px + env(safe-area-inset-top)) 20px 12px; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 2px 10px #18332622 }
    .route-heading { min-width:0; flex:1 }.route-heading h2 { margin:0; color:var(--green); font-size:clamp(18px,2.5vw,24px) }.route-summary-text { margin:4px 0 0; color:var(--ink); font-size:14px; font-weight:650; line-height:1.35 }
    .route-close { flex:none; min-width:56px; min-height:56px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 14px; border:0; border-radius:8px; background:var(--green); color:#fff; font:inherit; font-weight:750; cursor:pointer; touch-action:manipulation; box-shadow:0 2px 5px #18332633 }
    .route-close:hover,.route-close:focus-visible { background:var(--ink) }.route-close:focus-visible { outline:3px solid var(--accent); outline-offset:3px }.route-close-icon { font-size:24px; line-height:1 }
    .route-map-shell { position:relative; min-height:0; overflow:hidden; background:#e8eee9 }.route-map { width:100%; height:100%; min-height:0 }
    .route-status { position:absolute; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:1; margin:0; padding:8px 12px; border-radius:6px; background:#fff; color:var(--ink); box-shadow:0 2px 8px #18332633; font-size:13px }
    @media (max-width:600px) { .route-header { gap:10px; padding-left:14px; padding-right:14px }.route-close { padding:8px 10px }.route-summary-text { font-size:13px } }
    @media (max-width:800px) { main { grid-template-columns:1fr; height:auto }.menu { min-height:400px; max-height:65vh }.cart { border-left:0; border-top:1px solid var(--line); min-height:520px } }
    @media (max-width:520px) { .menu { grid-template-columns:120px minmax(0,1fr); gap:10px; padding:12px }.category { padding:10px; font-size:14px } #products { grid-template-columns:1fr; gap:8px }.product-image { height:72px } }
  </style>
<link rel="stylesheet" href="/pos-navigation.css?v=7"><link rel="stylesheet" href="/payment-dropdown.css?v=1"><script defer src="/pos-navigation.js?v=9"></script><link rel="manifest" href="/pos.webmanifest"><link rel="apple-touch-icon" href="/pos-icon.png"><meta name="theme-color" content="#2c6447"></head>
<body class="pos-screen">
  <header class="pos-header"><h1>Anise POS</h1><nav class="pos-navigation" aria-label="POS navigation"><a href="/pos.html">POS</a><a href="/orders.html">Order queue</a><a href="/history.html">Order history</a><a href="/menu-admin.html" data-roles="Owner,Manager" hidden>Menu manager</a><a href="/reports.html" data-roles="Owner,Manager" hidden>Reports</a><a id="website-settings-link" href="/website-settings.html" data-roles="Owner,Manager" hidden>Settings</a><a href="/staff-admin.html" data-roles="Owner" hidden>Staff</a></nav><span id="staff">Checking staff session…</span></header>
  <main><section class="menu"><nav class="categories" id="categories" aria-label="Menu categories"></nav><div id="products"></div></section>
  <aside class="cart"><div class="cart-heading"><h2>Current order</h2><button id="clear-order" class="clear-order" type="button">Clear order</button></div><div class="cart-lines" id="cart-lines"><p>Your cart is empty.</p></div><p id="delivery-warning" hidden></p><div class="custom-fee"><label>Fee description<input id="custom-fee-description" maxlength="160" placeholder="e.g. Extra item"></label><label>Fee (£)<input id="custom-fee" type="text" min="0" inputmode="decimal" placeholder="0.00" autocomplete="off"></label></div><button class="total" id="copy-total" type="button" disabled><span>Total</span><span id="total">£0.00</span></button><small id="copy-status" class="field-status" role="status"></small>
    <div class="types" id="types"><button class="active" data-type="Collection">Collection</button><button data-type="Delivery">Delivery</button></div>
    <label>Payment method</label><div class="types" id="payments"><button class="active" data-payment="Cash" type="button">Cash</button><button data-payment="Card" type="button" aria-haspopup="menu" aria-expanded="false">Card</button></div>
    <label>Name<input id="customer-name" autocomplete="name"></label><label>Phone<input id="customer-phone" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="tel"><small id="phone-lookup-status" class="field-status"></small></label><div id="delivery-fields" class="delivery-fields" hidden><div class="postcode-row"><label>Postcode<div id="postcode-search"><input id="manual-postcode" type="text" autocomplete="postal-code" placeholder="Enter postcode" hidden></div></label><button id="find-address" type="button">Map</button></div><button id="save-address" type="button">Save address</button><small id="save-address-status" class="field-status" role="status"></small><small id="places-status" class="field-status" role="status"></small><small id="address-lookup-status" class="field-status"></small><label id="address-results" hidden>Select address<select id="address-select"><option value="">Choose an address</option></select></label><label>Address line 1<input id="delivery-address" autocomplete="address-line1"></label><label>Address line 2 (optional)<input id="delivery-address-2" autocomplete="address-line2"></label><label>Delivery charge (£)<input id="delivery-fee" type="number" min="0" step="0.10" inputmode="decimal" value="0.00"></label><small id="delivery-fee-status" class="field-status" role="status"></small><label><input id="delivery-fee-override" type="checkbox" style="width:auto"> Manually override delivery fee</label></div><label>Order note<textarea id="notes" rows="2"></textarea></label>
    <label><span id="estimate-label">Estimated collection time</span><select id="estimate-minutes" aria-labelledby="estimate-label"></select></label>
    <button class="primary" id="place" disabled>Place order</button><button class="primary" id="print-draft" type="button" disabled>Print draft</button><p id="notice" role="status"></p>
  </aside></main><div id="route-summary" class="field-status" aria-live="polite"></div>
  <dialog id="product-dialog"><div class="modal"><h2 id="modal-name"></h2><div id="variant-choices"></div><div id="modifier-choices"></div><label>Special instructions<input id="special-instructions" maxlength="500" placeholder="e.g. No onions, extra spicy, less sauce"></label><label>Quantity<div class="modal-quantity"><button id="quantity-minus" type="button" aria-label="Decrease quantity">−</button><output id="custom-quantity" aria-live="polite">1</output><button id="quantity-plus" type="button" aria-label="Increase quantity">+</button></div></label><p id="modal-error" class="modal-error" role="alert" hidden></p><div class="modal-footer"><button id="cancel" type="button">Cancel</button><button class="primary" id="add" type="button">Add to order</button></div></div></dialog>
    <script src="/receipt-print.js?v=12"></script>
    <script src="/payment-dropdown.js?v=1"></script>
  <script>
    const state={ menu:[], category:null, cart:[], type:'Collection', payment:'Cash', selected:null, deliveryAddress:{postcode:'',line1:'',line2:''} };
    let printingDraft=false,placingOrder=false,savingAddress=false;
    let deliveryEditVersion=0,postcodeSearch,postcodeBlurTimer,postcodeSelectionPending=false;
    window.addEventListener('anise-open-caller-order', event => {
      const phone = event.detail?.phone;
      if (!phone || !/^[0-9]+$/.test(phone)) return;
      const fields = ['customer-name','customer-phone','delivery-address','delivery-address-2','notes','custom-fee-description'];
      const hasDraft = state.cart.length || fields.some(id => document.getElementById(id).value.trim()) ||
        Number(document.getElementById('custom-fee').value) > 0 || Number(document.getElementById('delivery-fee').value) > 0 ||
        state.deliveryAddress.postcode || state.type !== 'Collection' || state.payment !== 'Cash';
      if (placingOrder || printingDraft || savingAddress ||
          (hasDraft && !window.confirm('Replace the current in-progress order? Items and entered details will be lost.'))) return;
      if (hasDraft) clearCurrentOrder(true);
      if (event.detail.name) document.getElementById('customer-name').value = event.detail.name;
      const input = document.getElementById('customer-phone');
      input.value = phone;
      input.dispatchEvent(new Event('input', {bubbles:true}));
      input.scrollIntoView({block:'center'});
      input.focus();
      window.dispatchEvent(new CustomEvent('anise-caller-order-opened', {detail:{eventId:event.detail.eventId}}));
    });
    function updateEstimateOptions(){const select=document.querySelector('#estimate-minutes'),delivery=state.type==='Delivery';document.querySelector('#estimate-label').textContent='Estimated '+state.type.toLowerCase()+' time';select.replaceChildren();for(let minutes=5;minutes<=240;minutes+=5){const option=document.createElement('option');option.value=String(minutes);option.textContent=minutes+' minutes';select.append(option)}select.value=String(delivery?30:10)}
    updateEstimateOptions();
    const money=value=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(value);
    async function load(){
      const me=await fetch('/api/staff/me'); if(!me.ok){location.href='/staff-login.html';return} const staff=await me.json(); document.querySelector('#staff').textContent=`${staff.name} · ${staff.role}`; document.querySelector('#website-settings-link').hidden=!['Owner','Manager'].includes(staff.role);
      const response=await fetch('/api/menu'); state.menu=await response.json(); state.category=state.menu[0]?.id; renderMenu();
    }
    function escapeMenuText(value){return String(value).replace(/[&<>"']/g, char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
    const menuImageRevision = Date.now().toString();
    function dishImageSource(product) {
      if (product.imageUrl === `/api/menu/products/${product.id}/image`) {
        return escapeMenuText(product.imageUrl + '?v=' + menuImageRevision);
      }
      return escapeMenuText(product.imageUrl);
    }
    function renderMenu(){ const categories=document.querySelector('#categories'), products=document.querySelector('#products'); const categoryScroll=categories.scrollTop; categories.innerHTML=state.menu.map(c=>`<button type="button" class="category ${c.id===state.category?'active':''}" aria-pressed="${c.id===state.category}" data-id="${c.id}">${c.name}</button>`).join(''); categories.scrollTop=categoryScroll; categories.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.category=b.dataset.id;renderMenu();[...categories.querySelectorAll('button')].find(button=>button.dataset.id===state.category)?.focus()}); const cat=state.menu.find(c=>c.id===state.category); products.innerHTML=cat?.products.map(p=>`<button class="product" data-id="${p.id}">${p.imageUrl?`<img class="product-image" src="${dishImageSource(p)}" onerror="this.remove()" alt="" loading="lazy" decoding="async">`:""}${p.chineseName?.trim()?`<span class="chinese-name" lang="zh">${escapeMenuText(p.chineseName.trim())}</span>`:""}<h2>${p.name}</h2><span class="price">${p.variants.length===1?money(p.variants[0].price):p.variants.map(v=>`${v.name} ${money(v.price)}`).join(' · ')}</span></button>`).join('')||'<p>No available products. Add menu items first.</p>'; products.querySelectorAll('.product').forEach(b=>attachDishPress(b,cat.products.find(p=>p.id===b.dataset.id))); }
    function cartLineKey(variantId,mods,instructions=''){return `${variantId}|${mods.map(m=>`${m.id}:${m.price}`).sort().join(',')}|${instructions.trim()}`;}
    function addToCart(product, variant, mods, instructions='', quantity=1){ const cleanInstructions=instructions.trim(), key=cartLineKey(variant.id,mods,cleanInstructions), existing=state.cart.find(line=>line.key===key); if(existing){existing.qty+=quantity;}else{state.cart.push({key,variantId:variant.id,name:product.variants.length===1?product.name:`${product.name} — ${variant.name}`,unit:variant.price,mods,instructions:cleanInstructions,qty:quantity});} renderCart(); }
    function requiresSelection(product){return product.variants.length>1||product.modifierGroups.some(g=>g.minimumSelections>0);}
    let editingLine=null;
    function openProduct(product,line=null){ editingLine=line; state.selected=product; document.querySelector('#modal-name').textContent=product.name; document.querySelector('#variant-choices').innerHTML=product.variants.length===1?`<input type="hidden" name="variant" value="${product.variants[0].id}">`:`<label>Variant</label>${product.variants.map((v,i)=>`<label class="choice"><input type="radio" name="variant" value="${v.id}" ${i?'':'checked'}>${v.name} — ${money(v.price)}</label>`).join('')}`; document.querySelector('#modifier-choices').innerHTML=product.modifierGroups.map(g=>`<div><label>${g.name} <small>(${g.minimumSelections}-${g.maximumSelections})</small></label>${g.modifiers.map(m=>`<label class="choice"><input type="checkbox" data-group="${g.id}" value="${m.id}" data-price="${m.priceAdjustment}">${m.name}${m.priceAdjustment?` — ${money(m.priceAdjustment)}`:''}</label>`).join('')}</div>`).join(''); document.querySelector('#special-instructions').value=line?.instructions||''; const quantity=String(line?.qty||1); document.querySelector('#custom-quantity').value=quantity; document.querySelector('#custom-quantity').textContent=quantity; if(line){document.querySelectorAll('#variant-choices input[name=variant]').forEach(input=>input.checked=input.value===line.variantId);document.querySelectorAll('#modifier-choices input[type=checkbox]').forEach(input=>input.checked=line.mods.some(mod=>mod.id===input.value));} document.querySelector('#add').textContent=line?'Update item':'Add to order'; document.querySelector('#modal-error').hidden=true; document.querySelector('#product-dialog').showModal(); }
    function addQuick(product){if(requiresSelection(product)){openProduct(product);return;}addToCart(product,product.variants[0],[]);}
    function attachDishPress(button,product){let timer=null,moved=false,longPressed=false,startX=0,startY=0;const clear=()=>{if(timer){clearTimeout(timer);timer=null;}};button.addEventListener('contextmenu',event=>event.preventDefault());button.addEventListener('pointerdown',event=>{if(event.target.closest('button:not(.product)'))return;moved=false;longPressed=false;startX=event.clientX;startY=event.clientY;clear();timer=setTimeout(()=>{timer=null;longPressed=true;openProduct(product);},500);});button.addEventListener('pointermove',event=>{if(timer&&Math.hypot(event.clientX-startX,event.clientY-startY)>10){moved=true;clear();}});button.addEventListener('pointerup',event=>{clear();if(!moved&&!longPressed){event.preventDefault();addQuick(product);}longPressed=false;});button.addEventListener('pointercancel',()=>{clear();moved=false;longPressed=false;});button.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();addQuick(product);}});button.addEventListener('click',event=>{event.preventDefault();});}
    document.querySelector('#cancel').onclick=()=>document.querySelector('#product-dialog').close();
    document.querySelector('#product-dialog').addEventListener('close',()=>{editingLine=null;state.selected=null;});
    function showModalError(message){const error=document.querySelector('#modal-error');error.textContent=message;error.hidden=false;}
    document.querySelector('#quantity-minus').onclick=()=>{const output=document.querySelector('#custom-quantity'),quantity=Math.max(1,Number(output.value||output.textContent)-1);output.value=String(quantity);output.textContent=String(quantity);};
    document.querySelector('#quantity-plus').onclick=()=>{const output=document.querySelector('#custom-quantity'),quantity=Math.min(99,Number(output.value||output.textContent)+1);output.value=String(quantity);output.textContent=String(quantity);};

          script.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(c.browserKey)+'&libraries=places&loading=async&v=weekly&callback='+callback;
          script.onerror=()=>finish(new Error('Google Maps JavaScript API failed to load.'));
          timeout=setTimeout(()=>finish(new Error('Google Maps JavaScript API did not become ready.')),15000);
          document.head.append(script);
        }));
      return googleMapsPromise;
    }
    async function renderRouteMap(dialog,routeData){
      const {Map}=await google.maps.importLibrary('maps');
      const {encoding}=await google.maps.importLibrary('geometry');
      const mapElement=dialog.querySelector('#route-map');
      const origin={lat:51.5434592,lng:-0.1492259};
      const path=encoding.decodePath(routeData.encodedPolyline||'');
      if(!path.length)throw new Error('Google returned no route geometry.');
      const map=new Map(mapElement,{center:origin,zoom:13,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy'});
      dialog._routeMap=map;
      new google.maps.Marker({map,position:origin,title:'Anise, NW1 8ET'});
      const destination=path[path.length-1];
      new google.maps.Marker({map,position:destination,title:'Customer destination'});
      new google.maps.Polyline({map,path,geodesic:true,strokeColor:'#2c6447',strokeOpacity:1,strokeWeight:6});
      const bounds=new google.maps.LatLngBounds();path.forEach(point=>bounds.extend(point));map.fitBounds(bounds,48);
      const resize=()=>{const center=map.getCenter();google.maps.event.trigger(map,'resize');if(center)map.setCenter(center);map.fitBounds(bounds,48)};
      dialog._routeResize=resize;
      requestAnimationFrame(()=>requestAnimationFrame(resize));
      window.visualViewport?.addEventListener('resize',resize);
    }
    function closeRouteDialog(dialog){if(!dialog)return;window.visualViewport?.removeEventListener('resize',dialog._routeResize);window.visualViewport?.removeEventListener('resize',routeViewportHeight);dialog.close();dialog.remove()}
    function routeViewportHeight(){const height=window.visualViewport?.height||window.innerHeight;document.querySelector('#route-dialog .route-modal')?.style.setProperty('--route-vh',height+'px')}
    async function route(open){const v=++routeVersion,p=state.deliveryAddress.postcode.trim(),a=[document.querySelector('#delivery-address').value,document.querySelector('#delivery-address-2').value,p].filter(Boolean).join(', ');if(p.replace(/\s/g,'').length<5){if(open)alert('Enter a complete UK postcode before opening the map.');return}let d=open?document.querySelector('#route-dialog'):null;if(open){d=document.createElement('dialog');d.id='route-dialog';d.innerHTML='<div class="route-modal"><header class="route-header"><div class="route-heading"><h2>Driving route</h2><p class="route-summary-text" id="route-details">Loading route…</p></div><button class="route-close" type="button" aria-label="Close map"><span class="route-close-icon" aria-hidden="true">×</span><span>Close</span></button></header><div class="route-map-shell"><div id="route-map" class="route-map"></div><p class="route-status" id="route-status" role="status">Loading route…</p></div></div>';document.body.append(d);d.querySelector('.route-close').onclick=()=>closeRouteDialog(d);d.addEventListener('cancel',event=>{event.preventDefault();closeRouteDialog(d)});d.addEventListener('close',()=>{window.visualViewport?.removeEventListener('resize',d._routeResize);d.remove()},{once:true});d.showModal();routeViewportHeight();window.visualViewport?.addEventListener('resize',routeViewportHeight)}try{const r=await fetch('/api/orders/driving-route',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({postcode:p,address:a,placeId:selectedPlace?.id||null})});if(v!==routeVersion)return;if(!r.ok)throw new Error('Route request failed ('+r.status+').');const x=await r.json();const summary=`Driving distance: ${x.distanceMiles.toFixed(2)} miles · about ${x.durationMinutes} minutes`;document.querySelector('#route-summary').textContent=summary;renderCart();if(open){await loadGoogleMaps();await renderRouteMap(d,x);d.querySelector('#route-status').textContent='Route ready.';d.querySelector('#route-details').textContent=summary}}catch(error){if(v===routeVersion){document.querySelector('#route-summary').textContent='Driving route unavailable. Confirm a manual delivery charge.';if(open)d.querySelector('#route-status').textContent=error.message||'Map or route unavailable. Check the address or enter a manual delivery charge.'}}}
    document.querySelector('#find-address').onclick=()=>route(true);
    const manualPostcode=document.querySelector('#manual-postcode'),placesStatus=document.querySelector('#places-status');
    postcodeSearch=manualPostcode;
    function onPostcodeInput(){state.deliveryAddress.postcode='';selectedPlace=null;invalidateDeliveryQuote();markDeliveryEdited()}
    manualPostcode.addEventListener('input',onPostcodeInput);
    manualPostcode.addEventListener('blur',postcodeBlurred);
    async function initialisePlaceSearch(){
      let stage='Maps configuration or loading';
      try{
        await loadGoogleMaps();
        stage='Places library';
        const {PlaceAutocompleteElement}=await google.maps.importLibrary('places');
        if(!PlaceAutocompleteElement)throw new Error('Places autocomplete is unavailable.');
        stage='autocomplete widget';
        const widget=new PlaceAutocompleteElement();
        widget.id='place-autocomplete';
        widget.includedRegionCodes=['gb'];
        widget.placeholder='Search postcode, house number or street';
        widget.value=manualPostcode.value;
        widget.addEventListener('focus',postcodeFocused);
        widget.addEventListener('blur',postcodeBlurred);
        widget.addEventListener('input',onPostcodeInput);
        widget.addEventListener('gmp-error',event=>{const code=String(event.error?.code||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,60);console.error('Google Places widget error',code||'unspecified');manualPostcode.value=widget.value||'';manualPostcode.hidden=false;widget.replaceWith(manualPostcode);postcodeSearch=manualPostcode;placesStatus.textContent='Google Places search failed'+(code?' ('+code+')':'')+'. Enter the postcode and address manually.'});
        widget.addEventListener('gmp-select',async event=>{
          const editVersion=deliveryEditVersion;
          postcodeSelectionPending=true;
          clearTimeout(postcodeBlurTimer);
          try{
            const place=event.placePrediction.toPlace();
            await place.fetchFields({fields:['id','addressComponents']});
            if(editVersion!==deliveryEditVersion)return;
            const parts=Object.fromEntries((place.addressComponents||[]).map(x=>[x.types[0],x.longText]));
            const postcode=(parts.postal_code||'').toUpperCase(),street=String(parts.route||'').trim();
            if(!postcode)throw new Error('That address has no postcode. Enter it manually.');
            selectedPlace=place;
            state.deliveryAddress={postcode,line1:'',line2:street};
            document.querySelector('#delivery-address').value='';
            document.querySelector('#delivery-address-2').value=street;
            setPostcodeSearchValue(postcode,false);
            markDeliveryEdited();
            placesStatus.textContent='';
            route(false);
          }catch(error){placesStatus.textContent=error.message||'Could not read that address. Enter it manually.'}
          finally{postcodeSelectionPending=false}
        });
        manualPostcode.replaceWith(widget);
        postcodeSearch=widget;
      }catch(error){
        const message=String(error?.message||'Unknown initialization error').replace(/https?:\/\/[^\s)]+/gi,'[URL redacted]').replace(/AIza[\w-]+/g,'[redacted]').replace(/key=[^&\s]+/gi,'key=[redacted]');
        console.error('Google Places initialization failed at '+stage+':',String(error?.name||'Error'),message);
        manualPostcode.hidden=false;
        postcodeSearch=manualPostcode;
        placesStatus.textContent=(stage==='Maps configuration or loading'?message:'Google Places failed to initialise ('+stage+').')+' Enter the postcode and address manually.';
      }
    }
    initialisePlaceSearch();
    </script>
