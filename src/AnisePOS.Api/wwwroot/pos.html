<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anise POS</title>
  <style>
    :root { --ink:#20352a; --green:#2c6447; --paper:#f6f5ef; --line:#dbe2d9; --accent:#e7b65d; }
    * { box-sizing:border-box } body { margin:0; background:var(--paper); color:var(--ink); font:16px system-ui,sans-serif }
    header { height:68px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; background:#fff; border-bottom:1px solid var(--line) } h1 { font-size:22px; margin:0 } #staff { color:#617067 }
    main { display:grid; grid-template-columns:minmax(0,1fr) 390px; height:calc(100vh - 68px) }.menu { display:grid; grid-template-columns:180px minmax(0,1fr); gap:18px; padding:22px; min-width:0; min-height:0; overflow:hidden }.cart { background:#fff; border-left:1px solid var(--line); padding:20px; display:flex; flex-direction:column; overflow:auto }
    .categories { display:flex; flex-direction:column; align-items:stretch; gap:8px; overflow-y:auto; min-height:0; padding:0 4px 12px 0 }.category { flex:none; min-height:50px; border:1px solid var(--line); background:white; color:var(--ink); padding:12px 14px; border-radius:9px; text-align:left; overflow-wrap:anywhere; font-size:15px; font-weight:700; cursor:pointer }.category:focus-visible { outline:3px solid var(--accent); outline-offset:-3px }.category.active { background:var(--ink); color:#fff; border-color:var(--ink) }
    #products { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); align-content:start; align-items:stretch; gap:14px; overflow-y:auto; min-width:0; min-height:0; padding-right:4px }.product { width:100%; height:auto; min-width:0; min-height:126px; align-self:stretch; display:flex; flex-direction:column; align-items:stretch; text-align:left; border:1px solid var(--line); background:#fff; border-radius:12px; padding:14px; color:inherit; touch-action:pan-y; user-select:none }.product:active { transform:scale(.98) }.product-image { display:block; width:100%; height:78px; object-fit:cover; border-radius:6px; margin-bottom:8px; flex:none }.product h2 { min-width:0; flex:none; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; overflow-wrap:anywhere; font-size:17px; line-height:1.25; margin:0 0 6px }.product .chinese-name { min-width:0; flex:none; display:block; color:var(--ink); font-size:21px; font-weight:700; line-height:1.3; margin:0 0 6px; overflow-wrap:anywhere }.product p { color:#65756a; font-size:13px; margin:0 }.price { display:block; flex:none; min-width:0; margin-top:auto; padding-top:8px; color:var(--green); font-size:17px; line-height:1.3; font-weight:750; overflow-wrap:anywhere }
    h2 { font-size:19px; margin:0 0 14px }.cart-lines { flex:1 }.line { padding:12px 0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1fr auto; gap:8px }.line small { color:#65756a; display:block }.qty { display:flex; align-items:center; gap:5px }.qty button { width:42px; height:42px; border:1px solid var(--line); background:#fff; border-radius:7px; font-size:22px; line-height:1; touch-action:manipulation }.qty span { display:inline-block; min-width:28px; text-align:center; font-weight:700 }#delivery-warning{margin:12px 0 0;padding:10px 12px;border-radius:6px;background:#fff0d5;color:#8a5500;font-size:14px;font-weight:700}.custom-fee{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:end}.total { background:white;color:var(--green);border:0;cursor:pointer;font-family:inherit;display:flex; justify-content:space-between; font-size:21px; font-weight:750; padding:17px 0 }
    label { display:block; font-size:13px; font-weight:700; margin-top:12px } input,textarea,select { width:100%; margin-top:5px; padding:10px; border:1px solid var(--line); border-radius:6px; font:inherit } textarea { resize:vertical }.field-status{display:block;min-height:18px;margin-top:4px;color:#617067;font-size:12px;font-weight:500}.delivery-fields[hidden],#address-results[hidden]{display:none}.postcode-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:end;min-width:0}.postcode-row>label,#postcode-search{min-width:0;max-width:100%}#postcode-search{overflow:hidden}#postcode-search gmp-place-autocomplete{display:block;width:100%;max-width:100%;min-width:0;margin-top:5px}.postcode-row button{flex:0 0 auto;width:76px;min-height:43px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#edf2ed;color:var(--ink);font:inherit;font-weight:700}.types { display:flex; gap:6px }.types button { flex:1; padding:10px 4px; background:white; border:1px solid var(--line); border-radius:6px }.types button.active { background:var(--green); color:#fff; border-color:var(--green) }.primary { padding:14px; width:100%; background:var(--green); color:white; border:0; border-radius:7px; font-weight:750; font-size:16px; margin-top:16px }.primary:disabled { background:#93a59a } #notice { min-height:23px; color:#b03a2e; font-size:14px; margin-top:8px }.success { color:#207244!important }
    dialog { border:0; padding:0; border-radius:12px; width:min(480px,calc(100vw - 32px)); max-height:90vh; overflow:auto; box-shadow:0 18px 60px #0004 } dialog::backdrop { background:#18332677 }.modal { padding:24px }.modal h2 { margin-bottom:4px }.choice { display:flex; align-items:center; gap:9px; padding:10px 0; border-bottom:1px solid var(--line) }.choice input { width:auto; margin:0 }.modal-quantity { display:flex; align-items:center; gap:16px; margin-top:5px }.modal-quantity button { width:44px; height:44px; border:1px solid var(--line); border-radius:7px; background:#fff; font-size:24px }.modal-quantity output { min-width:32px; text-align:center; font-size:18px; font-weight:700 }.modal-error { color:#b03a2e; font-size:14px; font-weight:700 }.modal-footer { display:flex; gap:10px; margin:20px -24px -24px; padding:14px 24px; position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line) }.modal-footer button { flex:1; padding:12px; border-radius:6px; border:1px solid var(--line); background:white }.modal-footer .primary { margin:0; border:0; background:var(--green); color:#fff }
    #route-dialog { width:100vw; height:100vh; height:100dvh; max-width:none; max-height:none; margin:0; border-radius:0; overflow:hidden; padding:0; background:var(--paper) }
    #route-dialog::backdrop { background:#183326 }
    .route-modal { --route-vh:100dvh; width:100%; height:var(--route-vh); min-height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden; padding:0; background:var(--paper) }
    .route-header { position:relative; z-index:2; display:flex; align-items:center; gap:16px; min-height:86px; padding:calc(12px + env(safe-area-inset-top)) 20px 12px; background:#fff; border-bottom:1px solid var(--line); box-shadow:0 2px 10px #18332622 }
    .route-heading { min-width:0; flex:1 }.route-heading h2 { margin:0; color:var(--green); font-size:clamp(18px,2.5vw,24px) }.route-summary-text { margin:4px 0 0; color:var(--ink); font-size:14px; font-weight:650; line-height:1.35 }
    .route-close { flex:none; min-width:56px; min-height:56px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 14px; border:0; border-radius:8px; background:var(--green); color:#fff; font:inherit; font-weight:750; cursor:pointer; touch-action:manipulation; box-shadow:0 2px 5px #18332633 }
    .route-close:hover,.route-close:focus-visible { background:var(--ink) }.route-close:focus-visible { outline:3px solid var(--accent); outline-offset:3px }.route-close-icon { font-size:24px; line-height:1 }
    .route-map-shell { position:relative; min-height:0; overflow:hidden; background:#e8eee9 }.route-map { width:100%; height:100%; min-height:0 }
    .route-status { position:absolute; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:1; margin:0; padding:8px 12px; border-radius:6px; background:#fff; color:var(--ink); box-shadow:0 2px 8px #18332633; font-size:13px }
    @media (max-width:600px) { .route-header { gap:10px; padding-left:14px; padding-right:14px }.route-close { padding:8px 10px }.route-summary-text { font-size:13px } }
    @media (max-width:800px) { main { grid-template-columns:1fr; height:auto }.menu { min-height:400px; max-height:65vh }.cart { border-left:0; border-top:1px solid var(--line); min-height:520px } }
    @media (max-width:520px) { .menu { grid-template-columns:120px minmax(0,1fr); gap:10px; padding:12px }.category { padding:10px; font-size:14px } #products { grid-template-columns:1fr; gap:8px }.product-image { height:72px } }
  </style>
<link rel="stylesheet" href="/pos-navigation.css?v=4"><script defer src="/pos-navigation.js?v=4"></script><link rel="manifest" href="/pos.webmanifest"><link rel="apple-touch-icon" href="/pos-icon.png"><meta name="theme-color" content="#2c6447"></head>
<body class="pos-screen">
  <header class="pos-header"><h1>Anise POS</h1><nav class="pos-navigation" aria-label="POS navigation"><a href="/pos.html">POS</a><a href="/orders.html">Order queue</a><a href="/history.html">Order history</a><a href="/menu-admin.html" data-roles="Owner,Manager" hidden>Menu manager</a><a href="/reports.html" data-roles="Owner,Manager" hidden>Reports</a><a id="website-settings-link" href="/website-settings.html" data-roles="Owner,Manager" hidden>Settings</a><a href="/staff-admin.html" data-roles="Owner" hidden>Staff</a></nav><span id="staff">Checking staff session…</span></header>
  <main><section class="menu"><nav class="categories" id="categories" aria-label="Menu categories"></nav><div id="products"></div></section>
  <aside class="cart"><h2>Current order</h2><div class="cart-lines" id="cart-lines"><p>Your cart is empty.</p></div><p id="delivery-warning" hidden></p><div class="custom-fee"><label>Fee description<input id="custom-fee-description" maxlength="160" placeholder="e.g. Extra item"></label><label>Fee (£)<input id="custom-fee" type="number" min="0" step="0.10" inputmode="decimal" value="0.00"></label></div><button class="total" id="copy-total" type="button" disabled><span>Copy total</span><span id="total">£0.00</span></button><small id="copy-status" class="field-status" role="status"></small>
    <div class="types" id="types"><button class="active" data-type="Collection">Collection</button><button data-type="Delivery">Delivery</button></div>
    <label>Payment method</label><div class="types" id="payments"><button class="active" data-payment="Cash">Cash</button><button data-payment="Card">Card</button></div>
    <label>Name<input id="customer-name" autocomplete="name"></label><label>Phone<input id="customer-phone" autocomplete="tel"><small id="phone-lookup-status" class="field-status"></small></label><div id="delivery-fields" class="delivery-fields" hidden><div class="postcode-row"><label>Postcode<div id="postcode-search"></div></label><button id="find-address" type="button">Map</button></div><small id="address-lookup-status" class="field-status"></small><label id="address-results" hidden>Select address<select id="address-select"><option value="">Choose an address</option></select></label><label>Address line 1<input id="delivery-address" autocomplete="address-line1"></label><label>Address line 2 (optional)<input id="delivery-address-2" autocomplete="address-line2"></label><label>Delivery charge (£)<input id="delivery-fee" type="number" min="0" step="0.10" inputmode="decimal" value="0.00"></label></div><label>Order note<textarea id="notes" rows="2"></textarea></label>
    <label><span id="estimate-label">Estimated collection time</span><select id="estimate-minutes" aria-labelledby="estimate-label"></select></label>
    <button class="primary" id="place" disabled>Place order</button><p id="notice"></p>
  </aside></main><div id="route-summary" class="field-status" aria-live="polite"></div>
  <dialog id="product-dialog"><div class="modal"><h2 id="modal-name"></h2><div id="variant-choices"></div><div id="modifier-choices"></div><label>Special instructions<input id="special-instructions" maxlength="500" placeholder="e.g. No onions, extra spicy, less sauce"></label><label>Quantity<div class="modal-quantity"><button id="quantity-minus" type="button" aria-label="Decrease quantity">−</button><output id="custom-quantity" aria-live="polite">1</output><button id="quantity-plus" type="button" aria-label="Increase quantity">+</button></div></label><p id="modal-error" class="modal-error" role="alert" hidden></p><div class="modal-footer"><button id="cancel" type="button">Cancel</button><button class="primary" id="add" type="button">Add to order</button></div></div></dialog>
  <script src="/receipt-print.js?v=11"></script>
  <script>
    const state={ menu:[], category:null, cart:[], type:'Collection', payment:'Cash', selected:null, deliveryAddress:{postcode:'',line1:'',line2:''} };
    let deliveryEditVersion=0,postcodeSearch,postcodeBlurTimer,postcodeSelectionPending=false;
    function updateEstimateOptions(){const select=document.querySelector('#estimate-minutes'),delivery=state.type==='Delivery',step=delivery?10:5;document.querySelector('#estimate-label').textContent='Estimated '+state.type.toLowerCase()+' time';select.replaceChildren();for(let minutes=step;minutes<=240;minutes+=step){const option=document.createElement('option');option.value=String(minutes);option.textContent=minutes+' minutes';select.append(option)}select.value=String(delivery?30:10)}
    updateEstimateOptions();
    const money=value=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(value);
    async function load(){
      const me=await fetch('/api/staff/me'); if(!me.ok){location.href='/staff-login.html';return} const staff=await me.json(); document.querySelector('#staff').textContent=`${staff.name} · ${staff.role}`; document.querySelector('#website-settings-link').hidden=!['Owner','Manager'].includes(staff.role);
      const response=await fetch('/api/menu'); state.menu=await response.json(); state.category=state.menu[0]?.id; renderMenu();
    }
    function escapeMenuText(value){return String(value).replace(/[&<>"']/g, char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
    const menuImageRevision = Date.now().toString();
    function dishImageSource(product) {
      if (product.imageUrl === `/api/menu/products/${product.id}/image`) {
        return escapeMenuText(product.imageUrl + '?v=' + menuImageRevision);
      }
      return escapeMenuText(product.imageUrl);
    }
    function renderMenu(){ const categories=document.querySelector('#categories'), products=document.querySelector('#products'); const categoryScroll=categories.scrollTop; categories.innerHTML=state.menu.map(c=>`<button type="button" class="category ${c.id===state.category?'active':''}" aria-pressed="${c.id===state.category}" data-id="${c.id}">${c.name}</button>`).join(''); categories.scrollTop=categoryScroll; categories.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.category=b.dataset.id;renderMenu();[...categories.querySelectorAll('button')].find(button=>button.dataset.id===state.category)?.focus()}); const cat=state.menu.find(c=>c.id===state.category); products.innerHTML=cat?.products.map(p=>`<button class="product" data-id="${p.id}">${p.imageUrl?`<img class="product-image" src="${dishImageSource(p)}" onerror="this.remove()" alt="" loading="lazy" decoding="async">`:""}${p.chineseName?.trim()?`<span class="chinese-name" lang="zh">${escapeMenuText(p.chineseName.trim())}</span>`:""}<h2>${p.name}</h2><span class="price">${p.variants.length===1?money(p.variants[0].price):p.variants.map(v=>`${v.name} ${money(v.price)}`).join(' · ')}</span></button>`).join('')||'<p>No available products. Add menu items first.</p>'; products.querySelectorAll('.product').forEach(b=>attachDishPress(b,cat.products.find(p=>p.id===b.dataset.id))); }
    function cartLineKey(variantId,mods,instructions=''){return `${variantId}|${mods.map(m=>`${m.id}:${m.price}`).sort().join(',')}|${instructions.trim()}`;}
    function addToCart(product, variant, mods, instructions='', quantity=1){ const cleanInstructions=instructions.trim(), key=cartLineKey(variant.id,mods,cleanInstructions), existing=state.cart.find(line=>line.key===key); if(existing){existing.qty+=quantity;}else{state.cart.push({key,variantId:variant.id,name:product.variants.length===1?product.name:`${product.name} — ${variant.name}`,unit:variant.price,mods,instructions:cleanInstructions,qty:quantity});} renderCart(); }
    function requiresSelection(product){return product.variants.length>1||product.modifierGroups.some(g=>g.minimumSelections>0);}
    function openProduct(product){ state.selected=product; document.querySelector('#modal-name').textContent=product.name; document.querySelector('#variant-choices').innerHTML=product.variants.length===1?`<input type="hidden" name="variant" value="${product.variants[0].id}">`:`<label>Variant</label>${product.variants.map((v,i)=>`<label class="choice"><input type="radio" name="variant" value="${v.id}" ${i?'':'checked'}>${v.name} — ${money(v.price)}</label>`).join('')}`; document.querySelector('#modifier-choices').innerHTML=product.modifierGroups.map(g=>`<div><label>${g.name} <small>(${g.minimumSelections}-${g.maximumSelections})</small></label>${g.modifiers.map(m=>`<label class="choice"><input type="checkbox" data-group="${g.id}" value="${m.id}" data-price="${m.priceAdjustment}">${m.name}${m.priceAdjustment?` — ${money(m.priceAdjustment)}`:''}</label>`).join('')}</div>`).join(''); document.querySelector('#special-instructions').value=''; document.querySelector('#custom-quantity').value='1'; document.querySelector('#custom-quantity').textContent='1'; document.querySelector('#modal-error').hidden=true; document.querySelector('#product-dialog').showModal(); }
    function addQuick(product){if(requiresSelection(product)){openProduct(product);return;}addToCart(product,product.variants[0],[]);}
    function attachDishPress(button,product){let timer=null,moved=false,longPressed=false,startX=0,startY=0;const clear=()=>{if(timer){clearTimeout(timer);timer=null;}};button.addEventListener('contextmenu',event=>event.preventDefault());button.addEventListener('pointerdown',event=>{if(event.target.closest('button:not(.product)'))return;moved=false;longPressed=false;startX=event.clientX;startY=event.clientY;clear();timer=setTimeout(()=>{timer=null;longPressed=true;openProduct(product);},500);});button.addEventListener('pointermove',event=>{if(timer&&Math.hypot(event.clientX-startX,event.clientY-startY)>10){moved=true;clear();}});button.addEventListener('pointerup',event=>{clear();if(!moved&&!longPressed){event.preventDefault();addQuick(product);}longPressed=false;});button.addEventListener('pointercancel',()=>{clear();moved=false;longPressed=false;});button.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();addQuick(product);}});button.addEventListener('click',event=>{event.preventDefault();});}
    document.querySelector('#cancel').onclick=()=>document.querySelector('#product-dialog').close();
    function showModalError(message){const error=document.querySelector('#modal-error');error.textContent=message;error.hidden=false;}
    document.querySelector('#quantity-minus').onclick=()=>{const output=document.querySelector('#custom-quantity'),quantity=Math.max(1,Number(output.value||output.textContent)-1);output.value=String(quantity);output.textContent=String(quantity);};
    document.querySelector('#quantity-plus').onclick=()=>{const output=document.querySelector('#custom-quantity'),quantity=Math.min(99,Number(output.value||output.textContent)+1);output.value=String(quantity);output.textContent=String(quantity);};
    document.querySelector('#add').onclick=()=>{try{const product=state.selected;if(!product)throw new Error('No dish is selected.');const selected=[...document.querySelectorAll('#modifier-choices input:checked')],valid=product.modifierGroups.every(g=>{const n=selected.filter(x=>x.dataset.group===g.id).length;return n>=g.minimumSelections&&n<=g.maximumSelections});if(!valid){showModalError('Please follow each modifier selection requirement.');return}const variantInput=document.querySelector('#variant-choices input[name=variant]:checked')||document.querySelector('#variant-choices input[name=variant]');if(!variantInput)throw new Error('Choose a variant.');const variant=product.variants.find(v=>v.id===variantInput.value);if(!variant)throw new Error('The selected variant is unavailable.');const mods=selected.map(x=>({id:x.value,name:x.parentElement.textContent.trim(),price:+x.dataset.price})),instructions=document.querySelector('#special-instructions').value,quantity=Math.max(1,Math.min(99,Number(document.querySelector('#custom-quantity').value||document.querySelector('#custom-quantity').textContent)||1));addToCart(product,variant,mods,instructions,quantity);document.querySelector('#product-dialog').close();}catch(error){showModalError(error.message||'Could not add this dish. Please try again.');}};
    function renderCart(){const target=document.querySelector('#cart-lines');target.innerHTML=state.cart.length?state.cart.map((line,i)=>`<div class="line"><div><strong>${line.name}</strong>${line.mods.length?`<small>${line.mods.map(m=>m.name).join(', ')}</small>`:''}${line.instructions?`<small>Note: ${escapeMenuText(line.instructions)}</small>`:''}<small>${money((line.unit+line.mods.reduce((s,m)=>s+m.price,0))*line.qty)}</small></div><div class="qty"><button data-change="-1" data-i="${i}" type="button">−</button><span>${line.qty}</span><button data-change="1" data-i="${i}" type="button">+</button></div></div>`).join(''):'<p>Your cart is empty.</p>';target.querySelectorAll('button').forEach(b=>b.onclick=()=>{const l=state.cart[+b.dataset.i];l.qty+=+b.dataset.change;if(l.qty===0)state.cart.splice(+b.dataset.i,1);renderCart()});const subtotal=state.cart.reduce((s,l)=>s+(l.unit+l.mods.reduce((a,m)=>a+m.price,0))*l.qty,0),deliveryFee=state.type==='Delivery'?Math.max(0,Number(document.querySelector('#delivery-fee').value)||0):0,customFee=Math.max(0,Number(document.querySelector('#custom-fee').value)||0),total=subtotal+deliveryFee+customFee,warning=document.querySelector('#delivery-warning'),underMinimum=state.type==='Delivery'&&subtotal<18;document.querySelector('#total').textContent=money(total);document.querySelector('#copy-total').disabled=!state.cart.length;document.querySelector('#copy-status').textContent='';warning.hidden=!underMinimum;warning.textContent=underMinimum?`£18 minimum for delivery — add ${money(18-subtotal)} more.`:'';document.querySelector('#place').disabled=!state.cart.length;}
    document.querySelector('#copy-total').onclick = async () => {
      const amount = document.querySelector('#total').textContent.replace(/[£,]/g, '');
      const status = document.querySelector('#copy-status');
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(amount);
        } else {
          const field = document.createElement('textarea');
          field.value = amount;
          field.readOnly = true;
          document.body.append(field);
          try {
            field.select();
            field.setSelectionRange(0, amount.length);
            if (!document.execCommand('copy')) throw new Error();
          } finally {
            field.remove();
            document.querySelector('#copy-total').focus();
          }
        }
        status.textContent = 'Copied ' + amount;
      } catch {
        status.textContent = 'Could not copy. Enter ' + amount + ' in the Stripe app.';
      }
    };
    document.querySelectorAll('#types button').forEach(b=>b.onclick=()=>{const changed=state.type!==b.dataset.type;state.type=b.dataset.type;if(changed)updateEstimateOptions();document.querySelectorAll('#types button').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#delivery-fields').hidden=state.type!=='Delivery';renderCart()});
    document.querySelectorAll('#payments button').forEach(b=>b.onclick=()=>{state.payment=b.dataset.payment;document.querySelectorAll('#payments button').forEach(x=>x.classList.toggle('active',x===b))});
    function splitSavedAddress(value){const text=String(value||'').trim(),match=text.match(/\b(GIR ?0AA|[A-Z]{1,2}\d[A-Z\d]? ?\d[A-Z]{2})\b/i);const address=match?text.replace(match[0],'').replace(/^\s*,?\s*|\s*,?\s*$/g,'').trim():text,parts=address.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(parts.length===1&&parts[0].includes(',')){const comma=parts[0].indexOf(',');parts.splice(0,1,parts[0].slice(0,comma).trim(),parts[0].slice(comma+1).trim())}return{postcode:match?match[0].toUpperCase():'',line1:parts[0]||'',line2:parts.slice(1).join(', ')}}
    let phoneLookupTimer,phoneLookupVersion=0;document.querySelector('#customer-phone').addEventListener('input',e=>{clearTimeout(phoneLookupTimer);const phone=e.target.value,status=document.querySelector('#phone-lookup-status'),version=++phoneLookupVersion,editVersion=deliveryEditVersion;status.textContent='';if(phone.replace(/\D/g,'').length<7)return;phoneLookupTimer=setTimeout(async()=>{status.textContent='Looking up address…';try{const response=await fetch('/api/orders/address-by-phone?phone='+encodeURIComponent(phone),{cache:'no-store'});if(version!==phoneLookupVersion||editVersion!==deliveryEditVersion)return;if(!response.ok){status.textContent=response.status===404?'No saved delivery address found.':'';return}const match=await response.json(),saved=splitSavedAddress(match.deliveryAddress);if(version!==phoneLookupVersion||editVersion!==deliveryEditVersion)return;selectedPlace=null;state.deliveryAddress={postcode:saved.postcode,line1:saved.line1,line2:saved.line2};document.querySelector('#delivery-address').value=saved.line1;document.querySelector('#delivery-address-2').value=saved.line2;setPostcodeSearchValue(saved.postcode,true);if(!document.querySelector('#customer-name').value)document.querySelector('#customer-name').value=match.customerName||'';status.textContent='Saved delivery address found.';}catch{if(version===phoneLookupVersion&&editVersion===deliveryEditVersion)status.textContent='Address lookup unavailable.';}},500)});

    async function autoPrintReceipt(orderNumber){
      try {
        const response=await fetch('/api/orders/'+orderNumber+'/receipt',{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(15000)});
        if(!response.ok)throw new Error();
        const order=await response.json(),type='customer';
const xmlEscape=value=>String(value??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function printerContent(order){ return receiptPrinterContent(order); }
        const body=`<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body><epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">${printerContent(order)}<cut type="feed"/>${printerContent(order)}<cut type="feed"/></epos-print></s:Body></s:Envelope>`;
        const printed=await fetch('https://'+await receiptPrinterAddress()+'/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000',{method:'POST',headers:{'Content-Type':'text/xml; charset=utf-8'},body,signal:AbortSignal.timeout(15000),credentials:'omit'});
        if(!printed.ok)throw new Error();
        const xml=new DOMParser().parseFromString(await printed.text(),'application/xml'),result=xml.getElementsByTagNameNS('*','response')[0];
        return result?.getAttribute('success')==='true';
      } catch {return false;}
    }

    async function loadGoogleMaps(){if(googleMapsPromise)return googleMapsPromise;googleMapsPromise=fetch('/api/orders/google-maps-config',{credentials:'same-origin',cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Google Maps configuration request failed ('+r.status+').');return r.json()}).then(c=>new Promise((ok,no)=>{if(!c.browserKey)return no(new Error('Google Maps browser key is not configured on staging.'));const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(c.browserKey)+'&libraries=places&loading=async&v=weekly';s.onload=ok;s.onerror=()=>no(new Error('Google Maps JavaScript API could not be loaded. Check the browser-key restrictions and enabled APIs.'));document.head.append(s)}));return googleMapsPromise}
    async function renderRouteMap(dialog,routeData){
      const {Map}=await google.maps.importLibrary('maps');
      const {encoding}=await google.maps.importLibrary('geometry');
      const mapElement=dialog.querySelector('#route-map');
      const origin={lat:51.5434592,lng:-0.1492259};
      const path=encoding.decodePath(routeData.encodedPolyline||'');
      if(!path.length)throw new Error('Google returned no route geometry.');
      const map=new Map(mapElement,{center:origin,zoom:13,mapTypeControl:false,streetViewControl:false,fullscreenControl:false,gestureHandling:'greedy'});
      dialog._routeMap=map;
      new google.maps.Marker({map,position:origin,title:'Anise, NW1 8ET'});
      const destination=path[path.length-1];
      new google.maps.Marker({map,position:destination,title:'Customer destination'});
      new google.maps.Polyline({map,path,geodesic:true,strokeColor:'#2c6447',strokeOpacity:1,strokeWeight:6});
      const bounds=new google.maps.LatLngBounds();path.forEach(point=>bounds.extend(point));map.fitBounds(bounds,48);
      const resize=()=>{const center=map.getCenter();google.maps.event.trigger(map,'resize');if(center)map.setCenter(center);map.fitBounds(bounds,48)};
      dialog._routeResize=resize;
      requestAnimationFrame(()=>requestAnimationFrame(resize));
      window.visualViewport?.addEventListener('resize',resize);
    }
    function closeRouteDialog(dialog){if(!dialog)return;window.visualViewport?.removeEventListener('resize',dialog._routeResize);window.visualViewport?.removeEventListener('resize',routeViewportHeight);dialog.close();dialog.remove()}

derCart();if(open){await loadGoogleMaps();await renderRouteMap(d,x);d.querySelector('#route-status').textContent='Route ready.';d.querySelector('#route-details').textContent=summary}}catch(error){if(v===routeVersion){document.querySelector('#route-summary').textContent='Driving route unavailable. Confirm a manual delivery charge.';if(open)d.querySelector('#route-status').textContent=error.message||'Map or route unavailable. Check the address or enter a manual delivery charge.'}}}
    document.querySelector('#find-address').onclick=()=>route(true);postcodeSearch=document.createElement('gmp-place-autocomplete');postcodeSearch.id='place-autocomplete';postcodeSearch.setAttribute('included-region-codes','gb');postcodeSearch.setAttribute('placeholder','Search postcode, house number or street');document.querySelector('#postcode-search').append(postcodeSearch);postcodeSearch.addEventListener('focus',postcodeFocused);postcodeSearch.addEventListener('blur',postcodeBlurred);postcodeSearch.addEventListener('input',()=>{if(postcodeSearch.readonly)return;markDeliveryEdited()});
