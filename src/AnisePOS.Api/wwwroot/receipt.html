<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anise receipt</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;color:#111;font:16px system-ui,sans-serif}.controls{display:flex;gap:10px;justify-content:center;padding:18px}.controls a,.controls button{padding:11px 18px;border:1px solid #bbb;border-radius:7px;background:#fff;color:#20352a;font:inherit;text-decoration:none;cursor:pointer}.receipt{width:min(420px,calc(100% - 24px));margin:0 auto 30px;padding:24px;background:#fff;box-shadow:0 4px 18px #0002}h1{text-align:center;font-size:24px;margin:0 0 4px}h2{text-align:center;font-size:28px;margin:8px 0}.meta{text-align:center;color:#444;margin:4px 0}.customer{margin:18px 0;padding:12px 0;border-block:1px dashed #888;white-space:pre-wrap}.line{padding:11px 0;border-bottom:1px dashed #bbb}.line-head{display:flex;justify-content:space-between;gap:12px}.mods{font-size:14px;color:#444;margin:5px 0 0 20px}.totals{margin-top:14px}.total-row{display:flex;justify-content:space-between;padding:4px 0}.grand{font-size:21px;font-weight:800;border-top:2px solid #111;margin-top:7px;padding-top:9px}.note{margin-top:16px;padding:12px;background:#fff2d9;white-space:pre-wrap}.payment{margin-top:14px;text-align:center;font-weight:700}.kitchen .customer{font-size:18px}.kitchen .line{font-size:20px}.kitchen .mods{font-size:17px}.kitchen .prices,.kitchen .totals,.kitchen .payment{display:none}.error{text-align:center;color:#a32929}
@media print{body{background:#fff}.controls,#print-status{display:none}.receipt{width:100%;margin:0;padding:0;box-shadow:none}@page{margin:10mm}}
</style>
</head>
<body>
<div class="controls"><a id="back" href="/orders.html">Back to queue</a><button id="direct" disabled>Print</button></div>
<p id="print-status" role="status" style="text-align:center"></p>
<main class="receipt" id="receipt"><p>Loading receipt…</p></main>
<script>
'use strict';
const params=new URLSearchParams(location.search),orderNumber=params.get('order'),type='customer',target=document.querySelector('#receipt'),money=value=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(value),escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(params.get('return')==='history'){const back=document.querySelector('#back');back.href='/history.html';back.textContent='Back to history'}
const direct=document.querySelector('#direct'), printStatus=document.querySelector('#print-status');
let receiptOrder=null;
const xmlEscape=value=>String(value??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function printerContent(order){
 const kitchen=type==='kitchen', width=32, parts=[];
 const text=(value,attrs='')=>parts.push(`<text${attrs}>${xmlEscape(value)}</text>`);
 const row=(label,value)=>{const a=String(label),b=String(value);if(a.length+b.length+1>width)text(a+'\n'+b.padStart(width)+'\n');else text(a+' '.repeat(width-a.length-b.length)+b+'\n')};
 text('Anise\n',' align="center" em="true" width="2" height="2"');
 text((kitchen?'KITCHEN TICKET ':'RECEIPT ')+'#'+order.orderNumber+'\n',' align="center" em="true" width="1" height="2"');
 text(order.orderType+' · '+new Date(order.createdAtUtc).toLocaleString('en-GB')+'\n'+order.status+'\n',' align="center" em="false"');
 text('-'.repeat(width)+'\n',' align="left"');
 for(const line of [order.customerName,order.customerPhone,order.orderType==='Delivery'?order.deliveryAddress:null])if(line)text(line+'\n');
 if(order.customerName||order.customerPhone||(order.orderType==='Delivery'&&order.deliveryAddress))text('-'.repeat(width)+'\n');
 for(const line of order.lines){const name=line.quantity+' x '+line.productName+(line.variantName==='Regular'?'':' - '+line.variantName);if(kitchen)text(name+'\n',' em="true"');else row(name,money(line.lineTotal));text('',' em="false"');for(const mod of line.modifiers)text('  + '+mod.modifierName+(!kitchen&&mod.priceAdjustment?' ('+money(mod.priceAdjustment)+')':'')+'\n');if(line.notes)text('  Note: '+line.notes+'\n');}
 if(order.notes)text('\nNOTE: '+order.notes+'\n');
 if(!kitchen){text('-'.repeat(width)+'\n');row('Subtotal',money(order.subtotal));if(order.deliveryFee)row('Delivery',money(order.deliveryFee));if(order.customFee)row(order.customFeeDescription||'Additional charge',money(order.customFee));if(order.discountTotal)row('Discount','-'+money(order.discountTotal));text('',' em="true"');row('TOTAL',money(order.total));text('',' em="false"');text((order.payment?order.payment.method+' · '+order.payment.status:'Payment not recorded')+'\n',' align="center"');}
 text('\n\n\n');return parts.join('');
}
direct.onclick=async()=>{
 direct.disabled=true;printStatus.textContent='Sending to Epson…';
 try{
  const body=`<?xml version="1.0" encoding="utf-8"?><s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body><epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">${printerContent(receiptOrder)}<cut type="feed"/>${printerContent(receiptOrder)}<cut type="feed"/></epos-print></s:Body></s:Envelope>`;
  const response=await fetch('https://192.168.1.234/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000',{method:'POST',headers:{'Content-Type':'text/xml; charset=utf-8'},body,signal:AbortSignal.timeout(15000),credentials:'omit'});
  if(!response.ok)throw new Error('The printer returned HTTP '+response.status+'. Check the printer before retrying.');
  const xml=new DOMParser().parseFromString(await response.text(),'application/xml');
  const result=xml.getElementsByTagNameNS('*','response')[0];
  if(!result)throw new Error('The printer returned an unrecognised response. Check the printer before retrying.');
  if(result.getAttribute('success')!=='true')throw new Error('The printer reported an error ('+(result.getAttribute('code')||'unknown')+'). Check the printer before retrying.');
  printStatus.textContent='Printer accepted the job for two copies. Check the receipts.';
 }catch(error){printStatus.textContent=error.name==='TypeError'||error.name==='TimeoutError'?'Could not confirm printing. Check the printer before retrying, and check the iPad network and printer certificate.':error.message;}
 finally{direct.disabled=false}
};
(async()=>{if(!/^\d+$/.test(orderNumber||'')){target.innerHTML='<p class="error">Invalid order number.</p>';return}try{const response=await fetch('/api/orders/'+orderNumber+'/receipt',{credentials:'same-origin',cache:'no-store'});if(response.status===401){location.replace('/staff-login.html?return=%2Forders.html');return}if(!response.ok)throw new Error();const order=await response.json();receiptOrder=order;direct.disabled=false;document.title=`Anise — ${type==='kitchen'?'Kitchen ticket':'Receipt'} #${order.orderNumber}`;target.classList.add(type);const customer=[order.customerName,order.customerPhone,order.orderType==='Delivery'?order.deliveryAddress:null].filter(Boolean).map(escapeHtml).join('\n');const lines=order.lines.map(line=>`<div class="line"><div class="line-head"><strong>${line.quantity} × ${escapeHtml(line.productName)}${line.variantName==='Regular'?'':' — '+escapeHtml(line.variantName)}</strong><span class="prices">${money(line.lineTotal)}</span></div>${line.modifiers.length?`<div class="mods">${line.modifiers.map(m=>escapeHtml(m.modifierName)+(m.priceAdjustment?` (+${money(m.priceAdjustment)})`:'')).join('<br>')}</div>`:''}${line.notes?`<div class="mods">Note: ${escapeHtml(line.notes)}</div>`:''}</div>`).join('');target.innerHTML=`<h1>Anise</h1><h2>${type==='kitchen'?'KITCHEN · ':''}#${order.orderNumber}</h2><p class="meta">${escapeHtml(order.orderType)} · ${new Date(order.createdAtUtc).toLocaleString('en-GB')}</p><p class="meta">${escapeHtml(order.status)}</p>${customer?`<div class="customer">${customer}</div>`:''}${lines}${order.notes?`<div class="note"><strong>Note</strong><br>${escapeHtml(order.notes)}</div>`:''}<div class="totals"><div class="total-row"><span>Subtotal</span><span>${money(order.subtotal)}</span></div>${order.deliveryFee?`<div class="total-row"><span>Delivery</span><span>${money(order.deliveryFee)}</span></div>`:''}${order.customFee?`<div class="total-row"><span>${escapeHtml(order.customFeeDescription||'Additional charge')}</span><span>${money(order.customFee)}</span></div>`:''}${order.discountTotal?`<div class="total-row"><span>Discount</span><span>−${money(order.discountTotal)}</span></div>`:''}<div class="total-row grand"><span>Total</span><span>${money(order.total)}</span></div></div><div class="payment">${order.payment?escapeHtml(order.payment.method)+' · '+escapeHtml(order.payment.status):'Payment not recorded'}</div>`;}catch{target.innerHTML='<p class="error">Could not load this receipt.</p>'}})();
</script>
</body>
</html>
